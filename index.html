<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAIM - Digital Accounts Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brandPrimary: '#1a56db', brandDark: '#0f172a', surfaceLight: '#f8fafc' },
                    boxShadow: { 'sleek': '0 4px 20px -2px rgba(0, 0, 0, 0.05)', 'modal': '0 -10px 40px -10px rgba(0, 0, 0, 0.15)' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        #details-modal, #admin-panel, #region-modal, #checkout-modal { transition: opacity 0.3s ease-in-out; }
        #modal-content, #admin-content, #checkout-content { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(100%); }
        .modal-open #modal-content, .modal-open #admin-content, .modal-open #checkout-content { transform: translateY(0); }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px); }
        .pay-card { transition: all 0.2s ease; }
        .copy-btn:active { transform: scale(0.92); }
        .toast { animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .tab-btn.active { background: #0f172a; color: white; }
    </style>
</head>
<body class="text-slate-900 antialiased min-h-screen flex flex-col pb-6">

    <!-- Header -->
    <header class="glass-nav sticky top-0 z-40 border-b border-slate-200/60 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brandDark w-10 h-10 rounded-xl flex items-center justify-center shadow-lg text-white">
                    <i class="fas fa-shield-halved text-xl"></i>
                </div>
                <div class="font-black text-2xl tracking-tighter text-brandDark flex items-center">
                    NAIM <span class="ml-1.5 text-sm">🦅</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openRegionModal()" id="region-btn" class="h-10 px-3 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 text-xs font-bold gap-1.5">
                    <i class="fas fa-globe"></i><span id="region-label">...</span>
                </button>
                <button onclick="openAdmin()" class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center text-white shadow-md hover:bg-slate-800">
                    <i class="fas fa-lock"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-6" id="main-view">
        <div class="mb-8 bg-brandDark rounded-3xl p-6 sm:p-10 relative overflow-hidden shadow-xl">
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 -translate-y-1/2 translate-x-1/2"></div>
            <div class="relative z-10">
                <span class="inline-block py-1.5 px-3.5 rounded-full bg-white/10 text-white text-xs font-bold tracking-widest uppercase mb-4 backdrop-blur-md">Premium Assets</span>
                <h1 class="text-3xl sm:text-5xl font-black text-white leading-tight mb-2 tracking-tight">Digital Accounts Hub</h1>
            </div>
        </div>
        <div class="flex justify-between items-end mb-5">
            <h2 class="text-2xl font-black text-brandDark tracking-tight">Featured</h2>
            <span id="item-count" class="text-xs font-bold text-slate-500 uppercase tracking-widest">0 Items</span>
        </div>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5"></div>
    </main>

    <!-- Region Modal -->
    <div id="region-modal" class="fixed inset-0 z-[60] flex items-center justify-center pointer-events-none opacity-0">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeRegionModal()"></div>
        <div class="relative bg-white w-11/12 max-w-sm rounded-3xl p-6 pointer-events-auto shadow-2xl">
            <h3 class="text-xl font-black mb-1">Select Location</h3>
            <p class="text-xs text-slate-500 font-semibold mb-4">Currency & payment method change হবে</p>
            <div class="space-y-3">
                <button onclick="setRegion('BD')" class="w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50">
                    <span class="font-bold">Bangladesh (BDT)</span><span>🇧🇩</span>
                </button>
                <button onclick="setRegion('NG')" class="w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50">
                    <span class="font-bold">Nigeria (NGN)</span><span>🇳🇬</span>
                </button>
                <button onclick="setRegion('US')" class="w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50">
                    <span class="font-bold">Global (USDT)</span><span>🌍</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Product Details -->
    <div id="details-modal" class="fixed inset-0 z-50 flex items-end justify-center pointer-events-none opacity-0">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div id="modal-content" class="relative w-full max-w-md bg-white rounded-t-3xl shadow-modal pointer-events-auto flex flex-col max-h-[90vh]">
            <div class="w-full flex justify-center pt-3 pb-1"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div>
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="fas fa-times"></i></button>
            <div id="modal-body" class="overflow-y-auto px-6 pb-8 pt-2"></div>
        </div>
    </div>

    <!-- Checkout -->
    <div id="checkout-modal" class="fixed inset-0 z-[55] flex items-end justify-center pointer-events-none opacity-0">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeCheckout()"></div>
        <div id="checkout-content" class="relative w-full max-w-md bg-white rounded-t-3xl shadow-modal pointer-events-auto flex flex-col max-h-[92vh]">
            <div class="w-full flex justify-center pt-3 pb-1"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div>
            <button onclick="closeCheckout()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 z-10"><i class="fas fa-times"></i></button>
            <div id="checkout-body" class="overflow-y-auto px-6 pb-8 pt-4"></div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="fixed inset-0 z-50 flex items-end justify-center pointer-events-none opacity-0">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeAdmin()"></div>
        <div id="admin-content" class="relative w-full max-w-lg bg-white rounded-t-3xl shadow-modal pointer-events-auto flex flex-col h-[90vh]">
            <div class="w-full flex justify-center pt-3 pb-1"><div class="w-12 h-1.5 bg-slate-200 rounded-full"></div></div>
            <button onclick="closeAdmin()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200 z-10"><i class="fas fa-times"></i></button>
            <div class="px-6 pb-3 border-b border-slate-100">
                <h2 class="text-2xl font-black text-brandDark"><i class="fas fa-shield-halved mr-2"></i>Admin</h2>
                <div class="flex gap-2 mt-3">
                    <button onclick="switchTab('products')" id="tab-products" class="tab-btn active px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100">Products</button>
                    <button onclick="switchTab('payments')" id="tab-payments" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100">Payments</button>
                    <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100">Settings</button>
                </div>
            </div>
            <div id="admin-body" class="overflow-y-auto p-6 flex-grow"></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] bg-brandDark text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl opacity-0 pointer-events-none"></div>

    <script>
        // ============ STATE ============
        const rates = { USD: 1, BDT: 130, NGN: 1400 };
        let userCountry = 'US';
        let currentCurrency = 'USD';
        let currentSymbol = '$';
        let currentRate = 1;
        let selectedQuantity = 1;
        let activeProductId = null;

        // Default config — can be edited via Admin
        const DEFAULT_CONFIG = {
            whatsappNumber: '8801773204904',
            whatsappDisplay: '+880 1773-204904',
            payments: {
                BD: {
                    label: 'Bangladesh',
                    methods: [
                        { id: 'bkash', name: 'bKash', type: 'Personal', icon: 'fas fa-mobile-screen', color: 'text-pink-600', bg: 'bg-pink-50', border: 'border-pink-200', account: '01773204904', enabled: true },
                        { id: 'nagad', name: 'Nagad', type: 'Personal', icon: 'fas fa-mobile-screen', color: 'text-orange-600', bg: 'bg-orange-50', border: 'border-orange-200', account: '01773204904', enabled: true }
                    ]
                },
                NG: {
                    label: 'Nigeria',
                    methods: [
                        { id: 'opay', name: 'OPay', type: 'Bank Transfer', icon: 'fas fa-wallet', color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200', bank: 'OPay', account: '6598578587', holder: 'Bright Munachi Amaraegbu', enabled: true }
                    ]
                },
                US: {
                    label: 'Global',
                    methods: [
                        { id: 'usdt', name: 'USDT (Arbitrum)', type: 'Crypto', icon: 'fab fa-bitcoin', color: 'text-yellow-600', bg: 'bg-yellow-50', border: 'border-yellow-200', account: '0xf0f0c92a09bf1d8d48ccf529d253f19b029fade0', network: 'Arbitrum One', enabled: true }
                    ]
                }
            }
        };

        const DEFAULT_PRODUCTS = [
            { id: 1, title: 'PAGE', subtitle: 'Facebook Page', priceUSD: 1.10, icon: 'fas fa-flag', color: 'text-orange-500', bg: 'bg-orange-50' },
            { id: 2, title: 'OLD FB', subtitle: 'Standard Account', priceUSD: 1.20, icon: 'fab fa-facebook', color: 'text-blue-600', bg: 'bg-blue-50' },
            { id: 3, title: 'NEW FB', subtitle: 'Fresh Account', priceUSD: 0.70, icon: 'fab fa-facebook-square', color: 'text-blue-500', bg: 'bg-blue-50' },
            { id: 4, title: 'CUSTOM NAME', subtitle: 'New FB Profile', priceUSD: 0.85, icon: 'fas fa-user-pen', color: 'text-indigo-600', bg: 'bg-indigo-50' },
            { id: 5, title: 'APPLE ID', subtitle: 'Verified Account', priceUSD: 0.50, icon: 'fab fa-apple', color: 'text-slate-800', bg: 'bg-slate-100' },
            { id: 6, title: 'PC CLONE FB', subtitle: 'Desktop Created', priceUSD: 0.30, icon: 'fas fa-desktop', color: 'text-teal-600', bg: 'bg-teal-50' }
        ];

        let config = load('naim_config', DEFAULT_CONFIG);
        let products = load('naim_products', DEFAULT_PRODUCTS);
        let currentTab = 'products';

        // ============ STORAGE ============
        function load(key, fallback) {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
            catch { return fallback; }
        }
        function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
        function persistAll() { save('naim_config', config); save('naim_products', products); }

        // ============ HELPERS ============
        function formatPrice(usdPrice, qty = 1) {
            const converted = usdPrice * currentRate * qty;
            return `${currentSymbol} ${converted % 1 === 0 ? converted : converted.toFixed(2)}`;
        }

        function showToast(msg, color = 'bg-brandDark') {
            const t = document.getElementById('toast');
            t.className = `fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] ${color} text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl toast`;
            t.innerText = msg;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] bg-brandDark text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl opacity-0 pointer-events-none', 2000);
        }

        function copyText(text, label) {
            navigator.clipboard.writeText(text).then(() => showToast(label + ' copied ✓', 'bg-green-600')).catch(() => showToast('Copy failed', 'bg-red-600'));
        }

        // ============ IP DETECTION (fixed) ============
        async function detectCountry() {
            // Try ipwho.is first (free, CORS-friendly)
            try {
                const r = await fetch('https://ipwho.is/');
                const d = await r.json();
                if (d && d.success && d.country_code) return d.country_code;
            } catch (e) { console.warn('ipwho failed', e); }

            // Fallback: ipapi.co
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                if (d && d.country_code) return d.country_code;
            } catch (e) { console.warn('ipapi failed', e); }

            // Fallback: browser language
            const lang = (navigator.language || '').toUpperCase();
            if (lang.includes('BN') || lang.includes('BD')) return 'BD';
            if (lang.includes('NG')) return 'NG';
            return 'US';
        }

        async function initApp() {
            const code = await detectCountry();
            setRegion(code, false);
        }

        function setRegion(code, closeMenu = true) {
            userCountry = ['BD','NG','US'].includes(code) ? code : 'US';
            const map = { BD: ['BDT','৳',rates.BDT], NG: ['NGN','₦',rates.NGN], US: ['USD','$',rates.USD] };
            [currentCurrency, currentSymbol, currentRate] = map[userCountry];
            document.getElementById('region-label').innerText = userCountry;
            if (closeMenu) closeRegionModal();
            renderGrid();
        }

        // ============ RENDER GRID ============
        function renderGrid() {
            document.getElementById('item-count').innerText = `${products.length} Items`;
            const grid = document.getElementById('product-grid');
            if (!products.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fas fa-box-open text-4xl mb-3"></i><p class="font-bold">No products yet</p></div>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div onclick="openModal(${p.id})" class="bg-white rounded-2xl p-4 shadow-sleek border border-slate-100 flex flex-col cursor-pointer active:scale-95 transition-transform">
                    <div class="h-16 w-16 mx-auto mt-2 mb-4 ${p.bg} rounded-2xl flex items-center justify-center"><i class="${p.icon} ${p.color} text-3xl"></i></div>
                    <div class="text-center flex flex-col flex-grow">
                        <h3 class="text-sm font-bold text-brandDark uppercase line-clamp-1">${p.title}</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5 mb-3 font-medium truncate">${p.subtitle}</p>
                        <div class="text-lg font-black text-brandDark mb-3 mt-auto">${formatPrice(p.priceUSD)}</div>
                    </div>
                    <button class="w-full py-2.5 text-xs font-bold text-brandDark bg-slate-50 rounded-xl">Buy Now</button>
                </div>
            `).join('');
        }

        // ============ PRODUCT MODAL ============
        function changeQty(c) {
            if (selectedQuantity + c >= 1) {
                selectedQuantity += c;
                document.getElementById('qty-display').innerText = selectedQuantity;
                document.getElementById('modal-total-price').innerText = formatPrice(products.find(x => x.id === activeProductId).priceUSD, selectedQuantity);
            }
        }

        function openModal(id) {
            activeProductId = id;
            selectedQuantity = 1;
            const p = products.find(x => x.id === id);
            const paySet = config.payments[userCountry] || config.payments.US;
            const methodsHTML = paySet.methods.filter(m => m.enabled).map(m => `
                <div class="flex items-center space-x-3 p-3 rounded-xl border ${m.border} ${m.bg}">
                    <div class="w-8 h-8 rounded-full bg-white ${m.color} flex items-center justify-center text-sm shadow-sm"><i class="${m.icon}"></i></div>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-black ${m.color}">${m.name}</p>
                        <p class="text-[10px] text-slate-500 font-semibold">${m.type}</p>
                    </div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400 col-span-2">No payment methods</p>';

            document.getElementById('modal-body').innerHTML = `
                <div class="flex items-center space-x-4 mb-6">
                    <div class="h-16 w-16 ${p.bg} rounded-2xl flex items-center justify-center shrink-0"><i class="${p.icon} ${p.color} text-3xl"></i></div>
                    <div><h2 class="text-2xl font-black uppercase">${p.title}</h2><p class="text-sm font-semibold text-slate-500">${p.subtitle}</p></div>
                </div>
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-6">
                    <div><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Total Price</p><div class="text-3xl font-black text-brandDark" id="modal-total-price">${formatPrice(p.priceUSD, 1)}</div></div>
                    <div class="flex items-center space-x-3 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-100">
                        <button onclick="changeQty(-1)" class="w-8 h-8 bg-slate-100 rounded-lg font-black text-lg">-</button>
                        <span id="qty-display" class="font-black text-lg w-6 text-center">1</span>
                        <button onclick="changeQty(1)" class="w-8 h-8 bg-slate-900 text-white rounded-lg font-black text-lg">+</button>
                    </div>
                </div>
                <div class="mb-6">
                    <h3 class="text-sm font-bold text-brandDark uppercase tracking-widest mb-3">Payment Methods (${currentCurrency})</h3>
                    <div class="grid grid-cols-2 gap-2">${methodsHTML}</div>
                </div>
                <button onclick="openCheckout()" class="w-full py-4 text-base font-black text-white bg-brandDark rounded-2xl shadow-lg flex items-center justify-center space-x-2">
                    <i class="fas fa-bolt text-yellow-400"></i><span>Proceed to Checkout</span>
                </button>`;

            const modal = document.getElementById('details-modal');
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('modal-open');
        }

        function closeModal() {
            const m = document.getElementById('details-modal');
            m.classList.remove('modal-open'); m.classList.add('opacity-0');
            setTimeout(() => m.classList.add('pointer-events-none'), 300);
        }

        // ============ CHECKOUT ============
        function openCheckout() {
            closeModal();
            const p = products.find(x => x.id === activeProductId);
            const paySet = config.payments[userCountry] || config.payments.US;
            const total = formatPrice(p.priceUSD, selectedQuantity);

            const methodCards = paySet.methods.filter(m => m.enabled).map(m => {
                let detailHTML = '';
                if (m.bank) {
                    detailHTML = `
                        <div class="mt-2 bg-white rounded-lg p-3 border border-slate-100 space-y-1.5">
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Bank</p><p class="font-bold text-sm">${m.bank}</p></div>
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Account</p>
                                <div class="flex items-center justify-between"><p class="font-black text-sm text-brandDark tracking-wide">${m.account}</p>
                                <button onclick="copyText('${m.account}','Account')" class="copy-btn w-7 h-7 rounded-lg ${m.bg} ${m.color} flex items-center justify-center"><i class="fas fa-copy text-[10px]"></i></button></div>
                            </div>
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Name</p><p class="font-bold text-sm">${m.holder}</p></div>
                        </div>`;
                } else if (m.network) {
                    detailHTML = `
                        <div class="mt-2 bg-white rounded-lg p-3 border border-slate-100 space-y-1.5">
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Network</p><p class="font-bold text-sm">${m.network}</p></div>
                            <div><p class="text-[10px] font-bold text-slate-400 uppercase">Wallet</p>
                                <div class="flex items-start justify-between gap-2"><p class="font-mono text-[10px] text-brandDark break-all leading-tight">${m.account}</p>
                                <button onclick="copyText('${m.account}','Wallet')" class="copy-btn shrink-0 w-7 h-7 rounded-lg ${m.bg} ${m.color} flex items-center justify-center"><i class="fas fa-copy text-[10px]"></i></button></div>
                            </div>
                        </div>`;
                } else if (m.account) {
                    detailHTML = `
                        <div class="mt-2 bg-white rounded-lg p-3 border border-slate-100">
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Number</p>
                            <div class="flex items-center justify-between"><p class="font-black text-base text-brandDark tracking-wide">${m.account}</p>
                            <button onclick="copyText('${m.account}','Number')" class="copy-btn w-8 h-8 rounded-lg ${m.bg} ${m.color} flex items-center justify-center"><i class="fas fa-copy text-xs"></i></button></div>
                        </div>`;
                }
                return `
                    <div class="pay-card bg-white border ${m.border} rounded-2xl p-4">
                        <div class="flex items-center space-x-3 mb-1">
                            <div class="w-10 h-10 rounded-xl ${m.bg} ${m.color} flex items-center justify-center text-lg"><i class="${m.icon}"></i></div>
                            <div class="flex-1"><p class="font-black text-sm ${m.color}">${m.name}</p><p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">${m.type}</p></div>
                            <span class="text-[10px] font-black px-2 py-1 rounded-md ${m.bg} ${m.color}">SEND HERE</span>
                        </div>
                        ${detailHTML}
                    </div>`;
            }).join('') || '<p class="text-center text-slate-400 py-6 font-bold">No payment methods available</p>';

            document.getElementById('checkout-body').innerHTML = `
                <div class="text-center mb-5">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-green-100 text-green-600 mb-2"><i class="fas fa-lock text-lg"></i></div>
                    <h2 class="text-2xl font-black text-brandDark">Checkout</h2>
                    <p class="text-xs text-slate-500 font-semibold mt-1">Send exact amount to any method below</p>
                </div>
                <div class="bg-brandDark rounded-2xl p-5 mb-6 text-white">
                    <div class="flex items-center space-x-3 mb-3">
                        <div class="w-10 h-10 ${p.bg} rounded-xl flex items-center justify-center"><i class="${p.icon} ${p.color}"></i></div>
                        <div><p class="font-black text-sm">${p.title}</p><p class="text-[11px] text-slate-300">Qty: ${selectedQuantity}</p></div>
                    </div>
                    <div class="border-t border-white/10 pt-3 flex justify-between items-end">
                        <div><p class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">Amount</p><p class="text-2xl font-black text-yellow-400">${total}</p></div>
                        <button onclick="copyText('${total.replace(/[^0-9.]/g,'')}','Amount')" class="copy-btn px-3 py-1.5 bg-white/10 rounded-lg text-xs font-bold"><i class="fas fa-copy mr-1"></i>Copy</button>
                    </div>
                </div>
                <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Send Payment To:</h3>
                <div class="space-y-3 mb-6">${methodCards}</div>
                <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 mb-6">
                    <div class="flex items-start space-x-2">
                        <i class="fas fa-triangle-exclamation text-yellow-600 mt-0.5"></i>
                        <div class="text-[11px] text-yellow-900 font-semibold leading-relaxed">
                            <p class="font-black mb-1">Important:</p>
                            <p>Send EXACT amount. Payment করার পর নিচের button চাপুন — আপনার order details auto WhatsApp-এ চলে যাবে।</p>
                        </div>
                    </div>
                </div>
                <button onclick="sendToWhatsApp()" class="w-full py-4 text-base font-black text-white bg-brandDark rounded-2xl shadow-lg flex items-center justify-center space-x-2">
                    <i class="fab fa-whatsapp text-green-400 text-lg"></i><span>I've Paid — Confirm Order</span>
                </button>
                <p class="text-center text-[10px] text-slate-400 font-semibold mt-3">Processing time: 5–30 minutes</p>`;

            const cm = document.getElementById('checkout-modal');
            cm.classList.remove('pointer-events-none', 'opacity-0');
            cm.classList.add('modal-open');
        }

        function closeCheckout() {
            const m = document.getElementById('checkout-modal');
            m.classList.remove('modal-open'); m.classList.add('opacity-0');
            setTimeout(() => m.classList.add('pointer-events-none'), 300);
        }

        // ============ AUTO WHATSAPP ============
        function sendToWhatsApp() {
            if (!config.whatsappNumber) { showToast('WhatsApp number admin-এ set করুন', 'bg-red-600'); return; }
            const p = products.find(x => x.id === activeProductId);
            const total = formatPrice(p.priceUSD, selectedQuantity);
            const msg = encodeURIComponent(
                `Hi NAIM 🦅\n\n✅ NEW ORDER\n\n📦 Product: ${p.title} (${p.subtitle})\n🔢 Quantity: ${selectedQuantity}\n💰 Total: ${total}\n🌍 Region: ${(config.payments[userCountry]||config.payments.US).label}\n🕐 Time: ${new Date().toLocaleString()}\n\n📎 Payment proof attached.\nPlease process my order.`
            );
            window.open(`https://wa.me/${config.whatsappNumber.replace(/[^0-9]/g,'')}?text=${msg}`, '_blank');
            closeCheckout();
        }

        // ============ ADMIN ============
        function openAdmin() {
            renderAdmin();
            const ap = document.getElementById('admin-panel');
            ap.classList.remove('pointer-events-none', 'opacity-0');
            ap.classList.add('modal-open');
        }
        function closeAdmin() {
            const ap = document.getElementById('admin-panel');
            ap.classList.remove('modal-open'); ap.classList.add('opacity-0');
            setTimeout(() => ap.classList.add('pointer-events-none'), 300);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            renderAdmin();
        }

        function renderAdmin() {
            const body = document.getElementById('admin-body');
            if (currentTab === 'products') body.innerHTML = renderProductsTab();
            else if (currentTab === 'payments') body.innerHTML = renderPaymentsTab();
            else body.innerHTML = renderSettingsTab();
        }

        function renderProductsTab() {
            return `
                <h3 class="font-bold text-slate-500 uppercase tracking-wider text-xs mb-3">Products (${products.length})</h3>
                <div class="space-y-2 mb-4">
                    ${products.map(p => `
                        <div class="flex justify-between items-center bg-white border border-slate-200 p-3 rounded-xl shadow-sm">
                            <div class="flex items-center space-x-3 flex-1">
                                <div class="w-10 h-10 ${p.bg} rounded-lg flex items-center justify-center"><i class="${p.icon} ${p.color}"></i></div>
                                <div class="flex-1"><p class="font-bold text-sm leading-tight">${p.title}</p><p class="text-xs text-slate-500">$${p.priceUSD}</p></div>
                            </div>
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 bg-red-50 p-2 rounded-lg hover:bg-red-100"><i class="fas fa-trash-alt"></i></button>
                        </div>`).join('') || '<p class="text-xs text-slate-400 text-center py-4">No products</p>'}
                </div>
                <h3 class="font-bold text-slate-500 uppercase tracking-wider text-xs mb-3 mt-6">Add Product</h3>
                <div class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <input type="text" id="add-title" placeholder="Title" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-bold">
                    <input type="text" id="add-subtitle" placeholder="Subtitle" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-bold">
                    <input type="number" step="0.01" id="add-price" placeholder="Price USD" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-bold">
                    <button onclick="addNewProduct()" class="w-full py-3 bg-brandDark text-white font-bold rounded-xl shadow-md">+ Add Product</button>
                </div>`;
        }

        function renderPaymentsTab() {
            const regions = ['BD','NG','US'];
            return `
                <h3 class="font-bold text-slate-500 uppercase tracking-wider text-xs mb-3">Payment Accounts</h3>
                ${regions.map(r => {
                    const set = config.payments[r];
                    return `
                        <div class="mb-4 bg-slate-50 rounded-2xl p-4 border border-slate-200">
                            <p class="font-black text-sm mb-3">${set.label} (${r})</p>
                            <div class="space-y-2">
                                ${set.methods.map((m, i) => `
                                    <div class="bg-white rounded-xl p-3 border border-slate-100">
                                        <div class="flex items-center justify-between mb-2">
                                            <div class="flex items-center gap-2"><i class="${m.icon} ${m.color}"></i><span class="font-bold text-sm">${m.name}</span></div>
                                            <label class="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" ${m.enabled?'checked':''} onchange="toggleMethod('${r}',${i},this.checked)" class="sr-only peer">
                                                <div class="w-9 h-5 bg-slate-200 peer-checked:bg-green-500 rounded-full after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition peer-checked:after:translate-x-4"></div>
                                            </label>
                                        </div>
                                        ${m.bank ? `<input type="text" value="${m.bank}" placeholder="Bank name" onchange="updateMethod('${r}',${i},'bank',this.value)" class="w-full p-2 text-xs rounded-lg border mb-1">` : ''}
                                        ${m.holder ? `<input type="text" value="${m.holder}" placeholder="Account holder" onchange="updateMethod('${r}',${i},'holder',this.value)" class="w-full p-2 text-xs rounded-lg border mb-1">` : ''}
                                        ${m.network ? `<input type="text" value="${m.network}" placeholder="Network" onchange="updateMethod('${r}',${i},'network',this.value)" class="w-full p-2 text-xs rounded-lg border mb-1">` : ''}
                                        <input type="text" value="${m.account}" placeholder="Account / Wallet" onchange="updateMethod('${r}',${i},'account',this.value)" class="w-full p-2 text-xs rounded-lg border font-mono">
                                    </div>`).join('')}
                            </div>
                        </div>`;
                }).join('')}`;
        }

        function renderSettingsTab() {
            return `
                <h3 class="font-bold text-slate-500 uppercase tracking-wider text-xs mb-3">WhatsApp Settings</h3>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6">
                    <label class="text-xs font-bold text-slate-600 mb-1 block">WhatsApp Number (with country code, no +)</label>
                    <input type="text" value="${config.whatsappNumber}" placeholder="8801773204904" onchange="config.whatsappNumber=this.value.replace(/[^0-9]/g,'');persistAll();showToast('Saved ✓','bg-green-600')" class="w-full p-3 rounded-xl border border-slate-200 text-sm font-bold font-mono mb-2">
                    <p class="text-[10px] text-slate-500 font-semibold">Example: 8801773204904</p>
                </div>

                <h3 class="font-bold text-slate-500 uppercase tracking-wider text-xs mb-3">Reset</h3>
                <button onclick="resetAll()" class="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-md mb-2"><i class="fas fa-rotate-left mr-2"></i>Reset All to Default</button>
                <p class="text-[10px] text-slate-400 text-center">This will clear all saved data (products, payments, settings)</p>`;
        }

        function toggleMethod(region, idx, val) {
            config.payments[region].methods[idx].enabled = val;
            persistAll();
        }
        function updateMethod(region, idx, field, val) {
            config.payments[region].methods[idx][field] = val;
            persistAll();
        }
        function addNewProduct() {
            const title = document.getElementById('add-title').value.trim();
            const subtitle = document.getElementById('add-subtitle').value.trim() || 'Digital Asset';
            const price = parseFloat(document.getElementById('add-price').value);
            if (!title || isNaN(price)) { showToast('Title & price required', 'bg-red-600'); return; }
            products.push({ id: Date.now(), title, subtitle, priceUSD: price, icon: 'fas fa-box', color: 'text-slate-600', bg: 'bg-slate-100' });
            persistAll();
            document.getElementById('add-title').value = '';
            document.getElementById('add-subtitle').value = '';
            document.getElementById('add-price').value = '';
            renderGrid(); renderAdmin();
            showToast('Product added ✓', 'bg-green-600');
        }
        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            persistAll(); renderGrid(); renderAdmin();
            showToast('Deleted', 'bg-red-600');
        }
        function resetAll() {
            if (!confirm('সব ডাটা reset হবে। নিশ্চিত?')) return;
            localStorage.removeItem('naim_config');
            localStorage.removeItem('naim_products');
            config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
            products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
            renderGrid(); renderAdmin();
            showToast('Reset done ✓', 'bg-green-600');
        }

        function openRegionModal() {
            document.getElementById('region-modal').classList.remove('pointer-events-none', 'opacity-0');
        }
        function closeRegionModal() {
            document.getElementById('region-modal').classList.add('pointer-events-none', 'opacity-0');
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
  </html>
