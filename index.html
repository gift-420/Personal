<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>Ma Achiya Villa – Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'system-ui', 'sans-serif'],
                        'bengali': ['Noto Sans Bengali', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles (Premium Glassmorphism) -->
    <style>
        :root {
            --font-primary: 'Inter', sans-serif;
            --font-bengali: 'Noto Sans Bengali', sans-serif;
            --font-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
            --radius-md: 18px; --radius-lg: 24px; --radius-xl: 32px; --radius-full: 9999px;
            --duration-normal: 0.4s; --ease-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #06060e;
            --bg-gradient: radial-gradient(ellipse 90% 70% at 50% -30%, #1a1040 0%, #0d0d20 40%, #06060e 70%);
            --glass-bg: rgba(18, 18, 40, 0.55);
            --glass-bg-light: rgba(25, 25, 50, 0.35);
            --glass-bg-hover: rgba(30, 30, 58, 0.65);
            --glass-bg-strong: rgba(22, 22, 48, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            
            --accent-purple-light: #c4b5fd;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --logo-border: #34d399;
            --divider: rgba(255, 255, 255, 0.06);
        }

        [data-theme="light"] {
            --bg-primary: #f2f2f7;
            --bg-gradient: radial-gradient(ellipse 90% 70% at 50% -30%, #e0d8f0 0%, #f0eef5 40%, #f2f2f7 70%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-bg-light: rgba(255, 255, 255, 0.45);
            --glass-bg-hover: rgba(255, 255, 255, 0.78);
            --glass-bg-strong: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            
            --text-primary: #1c1c1e;
            --text-secondary: rgba(0, 0, 0, 0.65);
            --text-tertiary: rgba(0, 0, 0, 0.45);
            
            --accent-purple-light: #7c3aed;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --logo-border: #059669;
            --divider: rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-primary);
            background-image: var(--bg-gradient);
            min-height: 100vh; padding: 24px 20px;
            color: var(--text-primary);
            transition: background var(--duration-normal), color var(--duration-normal);
        }

        .ambient-orbs::before, .ambient-orbs::after {
            content: ''; position: fixed; border-radius: 50%; opacity: 0.3; filter: blur(100px); z-index: 0;
        }
        .ambient-orbs::before { top: -20%; left: -10%; width: 60%; height: 60%; background: #a78bfa; }
        .ambient-orbs::after { bottom: -20%; right: -10%; width: 60%; height: 60%; background: #60a5fa; }

        .glass-container {
            background: var(--glass-bg); backdrop-filter: blur(50px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
            box-shadow: var(--glass-shadow); position: relative; z-index: 10;
        }

        .stat-card {
            background: var(--glass-bg-light); border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg); padding: 18px 14px; text-align: center;
            transition: all var(--duration-normal);
        }
        .stat-card:hover { transform: translateY(-5px); background: var(--glass-bg-hover); }

        .stat-icon-wrap {
            width: 44px; height: 44px; border-radius: var(--radius-md); display: flex;
            align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 22px;
        }
        
        .logo-circle {
            width: 60px; height: 60px; border-radius: 50%; background: var(--glass-bg-strong);
            border: 2px solid var(--logo-border); display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.3); z-index: 2; position: relative;
        }
        .logo-text { text-align: center; line-height: 1.1; }
        .logo-bn { font-size: 11px; font-weight: 800; font-family: var(--font-bengali); }
        .logo-en { font-size: 8px; font-weight: 700; color: var(--text-tertiary); display: block; }

        .member-item {
            background: var(--glass-bg-light); border: 1px solid var(--glass-border);
            border-radius: var(--radius-md); padding: 15px 18px; margin-bottom: 10px;
        }
        
        .bazar-table, .meal-sheet-table { width: 100%; text-align: left; border-collapse: collapse; }
        th { padding: 12px; font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; border-bottom: 1px solid var(--divider); }
        td { padding: 12px; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid var(--divider); }

        .spinner {
            width: 30px; height: 30px; border: 3px solid var(--divider);
            border-top: 3px solid var(--accent-purple-light); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-orbs"></div>

    <div class="max-w-2xl mx-auto relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center mb-7">
            <div class="logo-circle">
                <div class="logo-text">
                    <span class="logo-bn"> </span>
                    <span class="logo-en">VILLA</span>
                </div>
            </div>

            <div class="flex-1 text-center">
                <div class="inline-block bg-white/10 backdrop-blur-md border border-white/10 rounded-full px-5 py-2">
                    <span class="block text-[10px] text-gray-400 uppercase tracking-wider" id="currentMonthYear">--</span>
                    <span class="text-sm font-bold text-white tracking-wide" id="managerName">Loading...</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" id="themeIcon" class="w-10 h-10 rounded-full bg-white/10 border border-white/10 flex items-center justify-center text-xl"></button>
                <div class="relative">
                    <button onclick="toggleMenu()" class="w-10 h-10 rounded-xl bg-white/10 border border-white/10 flex flex-col items-center justify-center gap-1">
                        <span class="w-5 h-0.5 bg-white rounded"></span>
                        <span class="w-4 h-0.5 bg-white rounded"></span>
                        <span class="w-3 h-0.5 bg-white rounded"></span>
                    </button>
                    <div id="menuDropdown" class="hidden absolute right-0 mt-2 w-48 bg-gray-900 border border-gray-700 rounded-xl shadow-xl overflow-hidden z-50">
                        <a href="login.html?role=admin" class="block px-4 py-3 text-sm text-white hover:bg-gray-800"> Manager Login</a>
                        <a href="login.html?role=assistant" class="block px-4 py-3 text-sm text-white hover:bg-gray-800"> Assistant Login</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="stat-card">
                <div class="stat-icon-wrap" style="background: rgba(167,139,250,0.15);"></div>
                <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Meal Rate</div>
                <div class="text-xl font-bold" id="currentMealRate">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrap" style="background: rgba(96,165,250,0.15);"></div>
                <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Total Meals</div>
                <div class="text-xl font-bold" id="totalMeals">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-wrap" style="background: rgba(52,211,153,0.15);"></div>
                <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Total Bazar</div>
                <div class="text-xl font-bold" id="totalBazar">—</div>
            </div>
        </div>

        <!-- Members Balance -->
        <div class="glass-container p-5 mb-5">
            <h2 class="text-lg font-bold mb-4"> Members Balance</h2>
            <div id="membersList"><div class="spinner"></div></div>
        </div>

        <!-- Master Meal Sheet -->
        <div class="glass-container p-5 mb-5">
            <h2 class="text-lg font-bold mb-4 flex justify-between items-center">
                <span> Today's Meal Sheet</span>
                <span class="text-xs font-normal text-gray-400" id="mealSheetDate"></span>
            </h2>
            <div class="overflow-x-auto">
                <table class="meal-sheet-table">
                    <thead><tr><th>Border</th><th class="text-center">Break</th><th class="text-center">Lunch</th><th class="text-center">Din</th></tr></thead>
                    <tbody id="mealSheetBody">
                        <tr><td colspan="4"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bazar History -->
        <div class="glass-container p-5 mb-5">
            <h2 class="text-lg font-bold mb-4"> Bazar History</h2>
            <div class="overflow-x-auto">
                <table class="bazar-table">
                    <thead><tr><th>Date</th><th>Purchaser</th><th class="text-right">Cost</th></tr></thead>
                    <tbody id="bazarList">
                        <tr><td colspan="3"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="text-center text-xs text-gray-500 mt-8 mb-4">
            Development by <strong>M M NAIME RAHMAN</strong><br>© Ma Achiya Villa
        </div>
    </div>

    <!-- Firebase System Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCp839knqRqJvkVOxOS2-MvD3KnnSL-Mio",
            authDomain: "my-mess-1c3a2.firebaseapp.com",
            projectId: "my-mess-1c3a2",
            storageBucket: "my-mess-1c3a2.firebasestorage.app",
            messagingSenderId: "148513277951",
            appId: "1:148513277951:web:411615103ce47405efc9ca",
            measurementId: "G-XCNMLEETXH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Functions attached to window so HTML buttons can use them
        window.toggleTheme = () => {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', target);
            document.getElementById('themeIcon').textContent = target === 'dark' ? '' : '';
        };

        let menuOpen = false;
        window.toggleMenu = () => {
            menuOpen = !menuOpen;
            document.getElementById('menuDropdown').style.display = menuOpen ? 'block' : 'none';
        };

        // Load Data Logic
        async function loadDashboard() {
            document.getElementById('currentMonthYear').textContent = new Date().toLocaleDateString('en-US', { month:'long', year:'numeric' }).toUpperCase();
            
            try {
                // 1. Manager Name
                const managerSnap = await getDoc(doc(db, 'settings', 'manager'));
                document.getElementById('managerName').textContent = managerSnap.exists() ? managerSnap.data().name : 'Manager';

                // 2. Fetch Bazar
                const bazarSnap = await getDocs(collection(db, 'bazar'));
                let totalBazar = 0;
                let bazarHtml = '';
                let bazarArr = [];
                bazarSnap.forEach(d => bazarArr.push(d.data()));
                bazarArr.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
                
                if(bazarArr.length === 0) bazarHtml = '<tr><td colspan="3" class="text-center">No bazar records</td></tr>';
                bazarArr.forEach(b => {
                    totalBazar += parseFloat(b.amount || 0);
                    bazarHtml += `<tr><td>${b.date}</td><td>${b.purchaser}</td><td class="text-right font-bold">${b.amount}</td></tr>`;
                });
                document.getElementById('bazarList').innerHTML = bazarHtml;
                document.getElementById('totalBazar').textContent = '' + totalBazar;

                // 3. Fetch Members & Calculate Total Meals
                const membersSnap = await getDocs(collection(db, 'members'));
                let totalMeals = 0;
                let membersArr = [];
                membersSnap.forEach(d => {
                    const m = { id: d.id, ...d.data() };
                    membersArr.push(m);
                    totalMeals += parseFloat(m.totalMeals || 0);
                });
                document.getElementById('totalMeals').textContent = totalMeals;

                // 4. Calculate Meal Rate
                let mealRate = 0;
                const rateSnap = await getDoc(doc(db, 'settings', 'mealRate'));
                if (rateSnap.exists() && rateSnap.data().rate) {
                    mealRate = parseFloat(rateSnap.data().rate);
                } else if (totalMeals > 0) {
                    mealRate = totalBazar / totalMeals;
                }
                document.getElementById('currentMealRate').textContent = '' + mealRate.toFixed(2);

                // 5. Render Member Balances
                let memberHtml = '';
                if(membersArr.length === 0) memberHtml = '<p class="text-center text-gray-400">No members registered yet</p>';
                membersArr.forEach(m => {
                    let deposit = parseFloat(m.totalDeposit || 0);
                    let meals = parseFloat(m.totalMeals || 0);
                    let balance = deposit - (meals * mealRate);
                    let isPos = balance >= 0;
                    
                    memberHtml += `
                        <div class="member-item flex justify-between items-center">
                            <div>
                                <h3 class="font-bold font-bengali text-[15px] text-white">${m.name}</h3>
                                <p class="text-xs text-gray-400 mt-1">Deposit: ${deposit} | Meals: ${meals}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-bold ${isPos ? 'text-green-400' : 'text-red-400'}">
                                    ${isPos ? '+' : '-'}${Math.abs(balance).toFixed(0)}
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('membersList').innerHTML = memberHtml;

                // 6. Today's Meal Sheet
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('mealSheetDate').textContent = today;
                const mealSnap = await getDoc(doc(db, 'meals', today));
                let mealHtml = '';
                
                if(mealSnap.exists() && mealSnap.data().members) {
                    const mData = mealSnap.data().members;
                    membersArr.forEach(m => {
                        let record = mData[m.id] || { breakfast: 0, lunch: 0, dinner: 0 };
                        mealHtml += `<tr>
                            <td class="font-bengali text-white font-medium">${m.name}</td>
                            <td class="text-center">${record.breakfast ? '' : ''}</td>
                            <td class="text-center">${record.lunch ? '' : ''}</td>
                            <td class="text-center">${record.dinner ? '' : ''}</td>
                        </tr>`;
                    });
                } else {
                    mealHtml = '<tr><td colspan="4" class="text-center py-4">No meal data updated for today yet.</td></tr>';
                }
                document.getElementById('mealSheetBody').innerHTML = mealHtml;

            } catch(e) {
                console.error(e);
                alert("Database Setup Error! Ensure Firestore Rules are open (allow read, write: if true;).");
            }
        }

        // Initialize Call
        loadDashboard();
    </script>
</body>
</html>
