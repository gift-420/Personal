<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NAIM — Digital Accounts Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Outfit', 'sans-serif'] },
    colors: { brandPrimary: '#1a56db', brandDark: '#0f172a' }
  }}
}
</script>
<style>
* { -webkit-tap-highlight-color: transparent; }
body {
  background:
    radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  background-attachment: fixed; min-height: 100vh; color: #f3f8ff;
}
::-webkit-scrollbar { display: none; }
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
  -webkit-backdrop-filter: blur(14px) saturate(145%);
}
.glass-nav { background: rgba(8,22,43,.78); border-bottom: 1px solid rgba(180,225,255,.2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.product-card { transition: transform .16s ease, box-shadow .16s ease; }
.product-card:hover { transform: translateY(-4px); }
.product-card:active { transform: scale(0.98); }
.shimmer-text {
  background: linear-gradient(90deg, #a6e8ff, #fff, #b7a7ff);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
</style>
</head>
<body class="antialiased pb-10">

<header id="site-header"></header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div class="mb-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 rounded-3xl p-6 sm:p-10 relative overflow-hidden shadow-2xl border border-white/10">
    <div class="absolute top-0 right-0 w-72 h-72 bg-blue-500 rounded-full filter blur-3xl opacity-30 -translate-y-1/2 translate-x-1/2"></div>
    <div class="absolute bottom-0 left-0 w-64 h-64 bg-purple-500 rounded-full filter blur-3xl opacity-25 translate-y-1/2 -translate-x-1/2"></div>
    <div class="relative z-10">
      <span class="inline-block py-1 px-3 rounded-full bg-white/10 text-white text-[10px] font-black tracking-widest uppercase mb-3 backdrop-blur-md border border-white/20">
        <i class="fas fa-bolt text-yellow-400 mr-1"></i> M M NAIME RAHMAN
      </span>
      <h1 class="text-3xl sm:text-5xl font-black text-white leading-tight mb-2 tracking-tight">
        Digital Accounts <span class="shimmer-text">Hub</span>
      </h1>
      <p class="text-slate-300 text-xs sm:text-sm font-medium max-w-lg">Honesty is the rarest wealth anyone can possess 🤍.</p>
    </div>
  </div>

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-black text-white tracking-tight">Products</h2>
    <span id="item-count" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Loading...</span>
  </div>

  <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>

  <div class="mt-10 text-center text-[10px] text-slate-500 font-semibold pb-4">
    <p>NAIM — Trusted Digital Account Store · © 2025</p>
  </div>
</main>

<script type="module">
import { db, getDoc, doc } from './js/firebase.js';
import { cacheProducts, cachedProducts, formatPrice, currentRegion } from './js/store.js';
import { DEFAULT_PRODUCTS } from './js/products.js';
import { renderHeader } from './js/ui.js';

renderHeader('home');

let products = cachedProducts() || DEFAULT_PRODUCTS;
render();

try {
  const snap = await getDoc(doc(db, 'settings', 'products'));
  if (snap.exists() && Array.isArray(snap.data().list)) {
    products = snap.data().list;
    cacheProducts(products);
    render();
  }
} catch (e) { console.warn('Firebase load failed:', e); }

function render() {
  document.getElementById('item-count').textContent = products.length + ' items';
  document.getElementById('product-grid').innerHTML = products.map(p => `
    <div class="product-card glass rounded-2xl p-3 flex flex-col">
      <a href="product.html?id=${p.id}" class="flex-grow text-center flex flex-col items-center">
        <div class="h-14 w-14 mx-auto mt-1 mb-3 ${p.bg} rounded-xl flex items-center justify-center shadow-sm">
          <i class="${p.icon} ${p.color} text-2xl"></i>
        </div>
        <h3 class="text-xs font-black text-white uppercase line-clamp-1">${p.title}</h3>
        <p class="text-[10px] text-slate-300 mt-0.5 mb-2 font-semibold truncate">${p.subtitle}</p>
        <div class="text-base font-black text-white mb-2">${formatPrice(p.priceUSD)}</div>
      </a>
      <a href="product.html?id=${p.id}" class="w-full py-2 text-center text-[11px] font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-md">
        Buy Now →
      </a>
    </div>
  `).join('');
}
</script>
</body>
</html>
