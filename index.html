<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naim Score - Advanced Game Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Confetti Library for Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-base: #0b1120;
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Ambient Background Animations */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
            animation: float 25s infinite ease-in-out alternate;
        }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #3b82f6; }
        .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #eab308; animation-delay: -5s; }
        .orb-3 { top: 40%; left: 50%; width: 40vw; height: 40vw; background: #10b981; animation-delay: -10s; opacity: 0.15; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(15%, 20%) scale(1.15); }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* Input Styling Overrides */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .bounce-in { animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Leader Highlighting */
        .leader-card {
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.15), inset 0 0 20px rgba(250, 204, 21, 0.05);
            border-color: rgba(250, 204, 21, 0.4);
            position: relative;
        }
        .leader-card::before {
            content: ''; position: absolute; inset: -1px; border-radius: inherit;
            background: linear-gradient(to bottom right, rgba(250, 204, 21, 0.4), transparent);
            z-index: -1; opacity: 0.5;
        }

        /* Modal Overlay */
        #modal-overlay {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col items-center">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="w-full max-w-5xl px-4 py-8 md:py-12 relative z-10 flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="text-center mb-8 slide-up">
            <h1 class="text-4xl md:text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 via-amber-500 to-orange-500 tracking-tight flex items-center justify-center gap-3 drop-shadow-lg">
                <i class="ph-fill ph-trophy text-yellow-400"></i> Naim Score
            </h1>
            <p class="text-slate-400 mt-2 text-sm md:text-base font-medium tracking-wide">SMART GAME TRACKER</p>
        </header>

        <!-- SETUP VIEW -->
        <section id="setup-view" class="glass-panel rounded-[2rem] p-6 md:p-10 mx-auto w-full max-w-xl slide-up hidden">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-white mb-2">Match Configuration</h2>
                <p class="text-slate-400 text-sm">Set the winning score and add players.</p>
            </div>

            <!-- Target Score Setting -->
            <div class="mb-8 p-4 bg-slate-900/60 rounded-2xl border border-yellow-500/30 flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-2xl shrink-0">
                    <i class="ph-bold ph-target"></i>
                </div>
                <div class="flex-grow">
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Target Game Point</label>
                    <input type="number" id="target-score-input" class="w-full bg-transparent text-2xl font-black text-white focus:outline-none" placeholder="e.g. 100" value="100">
                </div>
            </div>
            
            <div id="players-list" class="space-y-4 mb-8">
                <!-- Inputs injected by JS -->
            </div>

            <div class="flex flex-col gap-4">
                <button onclick="addPlayerInput()" class="w-full py-3.5 rounded-2xl border border-slate-600/50 text-slate-300 hover:text-white hover:bg-slate-800/80 hover:border-slate-500 transition-all flex items-center justify-center gap-2 group font-medium">
                    <i class="ph ph-plus-circle text-xl group-hover:text-amber-400 transition-colors"></i> Add Another Player
                </button>
                <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-yellow-500 to-orange-600 hover:from-yellow-400 hover:to-orange-500 text-white font-bold text-lg shadow-[0_0_20px_rgba(245,158,11,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                    Start Match <i class="ph-bold ph-play"></i>
                </button>
            </div>
        </section>

        <!-- GAME DASHBOARD -->
        <section id="game-view" class="hidden flex-col gap-8 w-full pb-16">
            
            <!-- Top Controls bar -->
            <div class="flex flex-col md:flex-row justify-between items-center glass-panel p-4 px-6 rounded-2xl gap-4">
                <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-start">
                    <div class="text-slate-300 font-semibold flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400">
                            <i class="ph-bold ph-hash"></i>
                        </div>
                        Round <span id="round-counter" class="text-white text-xl ml-1 font-bold">1</span>
                    </div>
                    <div class="text-slate-300 font-semibold flex items-center gap-2 border-l border-white/10 pl-6">
                        <div class="w-8 h-8 rounded-full bg-yellow-500/20 flex items-center justify-center text-yellow-400">
                            <i class="ph-bold ph-target"></i>
                        </div>
                        Target: <span id="display-target" class="text-white text-xl ml-1 font-bold">100</span>
                    </div>
                </div>

                <div class="flex gap-3 w-full md:w-auto justify-end">
                    <button onclick="undoLastRound()" id="undo-btn" class="hidden px-4 py-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl hover:bg-rose-500/20 transition-all text-sm font-bold flex items-center gap-2">
                        <i class="ph-bold ph-arrow-u-up-left"></i> Undo
                    </button>
                    <button onclick="confirmReset()" class="px-4 py-2 bg-slate-800 text-rose-400 rounded-xl hover:bg-rose-900/50 transition-all text-sm font-bold border border-rose-900/50 flex items-center gap-2">
                        <i class="ph-bold ph-trash"></i> Clear Game
                    </button>
                </div>
            </div>

            <!-- Score Cards Grid -->
            <div id="score-cards-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Cards injected by JS -->
            </div>

            <!-- Main Action Area -->
            <div class="flex justify-center mt-2 sticky bottom-6 z-30">
                <button onclick="submitScores()" class="w-full max-w-md py-4 rounded-3xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold text-xl shadow-[0_15px_30px_rgba(16,185,129,0.3)] border border-emerald-400/30 transition-all active:scale-[0.97] flex items-center justify-center gap-3 backdrop-blur-md">
                    <i class="ph-bold ph-check-circle text-2xl"></i> Submit Points
                </button>
            </div>

            <!-- Advanced Play History -->
            <div class="glass-panel rounded-3xl overflow-hidden mt-8 flex flex-col shadow-2xl border-t border-white/10">
                <div class="px-6 py-5 border-b border-white/5 bg-gradient-to-r from-slate-800/80 to-transparent flex justify-between items-center">
                    <h3 class="font-bold text-xl text-white flex items-center gap-3">
                        <div class="p-2 bg-purple-500/20 rounded-lg text-purple-400">
                            <i class="ph-bold ph-clock-counter-clockwise"></i>
                        </div>
                        Recent Play History
                    </h3>
                    <span class="text-xs font-semibold px-3 py-1 bg-slate-800 rounded-full text-slate-400 border border-slate-700" id="history-count">0 Rounds</span>
                </div>
                
                <div class="overflow-x-auto p-4 custom-scrollbar">
                    <div class="min-w-max flex flex-col gap-3" id="history-timeline">
                        <!-- History Rows injected by JS -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Custom Modal -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div id="modal-content" class="glass-panel w-full max-w-sm rounded-[2rem] p-8 text-center transform scale-95 transition-transform duration-300 border border-white/20 shadow-2xl">
            <div id="modal-icon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                <!-- Icon injected -->
            </div>
            <h3 id="modal-title" class="text-2xl font-black text-white mb-3">Title</h3>
            <p id="modal-message" class="text-slate-300 mb-8 font-medium">Message</p>
            <div id="modal-actions" class="flex gap-3 justify-center">
                <!-- Buttons injected -->
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'naimScore_GameState';
        
        // Application State
        let state = {
            isActive: false,
            targetScore: 100,
            players: [],
            historyLog: [],
            winnerDeclared: false
        };

        const MAX_PLAYERS = 8;
        const DEFAULT_PLAYERS = 2;
        const themeColors = [
            { grad: 'from-blue-500 to-cyan-400', hex: '#38bdf8' },
            { grad: 'from-purple-500 to-pink-500', hex: '#d946ef' },
            { grad: 'from-emerald-500 to-teal-400', hex: '#34d399' },
            { grad: 'from-orange-500 to-amber-400', hex: '#fbbf24' },
            { grad: 'from-rose-500 to-red-500', hex: '#f43f5e' },
            { grad: 'from-indigo-500 to-blue-600', hex: '#6366f1' },
            { grad: 'from-fuchsia-500 to-purple-600', hex: '#a855f7' },
            { grad: 'from-lime-500 to-green-500', hex: '#84cc16' }
        ];

        // --- Initialization & Setup ---
        function initApp() {
            const savedState = localStorage.getItem(STORAGE_KEY);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    if (parsed.isActive) {
                        state = parsed;
                        loadGameView();
                        return;
                    }
                } catch (e) {
                    console.error("Error parsing local storage", e);
                }
            }
            
            // Default setup view
            document.getElementById('setup-view').classList.remove('hidden');
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            for(let i = 0; i < DEFAULT_PLAYERS; i++) {
                addPlayerInput();
            }
        }

        function addPlayerInput() {
            const list = document.getElementById('players-list');
            const count = list.children.length;
            if (count >= MAX_PLAYERS) return showCustomModal('Limit Reached', `Maximum ${MAX_PLAYERS} players allowed.`, 'info');

            const theme = themeColors[count % themeColors.length];
            const div = document.createElement('div');
            div.className = 'flex items-center gap-3 fade-in group';
            div.innerHTML = `
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${theme.grad} flex items-center justify-center font-bold text-white shadow-lg shrink-0 border border-white/20">
                    <i class="ph-fill ph-user"></i>
                </div>
                <div class="relative flex-grow">
                    <input type="text" class="player-name-input w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:border-[${theme.hex}] focus:ring-1 focus:ring-[${theme.hex}] transition-all" placeholder="Player ${count + 1}" value="Player ${count + 1}">
                </div>
                ${count >= 2 ? `<button onclick="this.parentElement.remove()" class="text-slate-600 hover:text-rose-400 p-3 bg-slate-800/30 hover:bg-rose-500/10 rounded-xl transition-all"><i class="ph-bold ph-trash"></i></button>` : `<div class="w-11"></div>`}
            `;
            list.appendChild(div);
        }

        function startGame() {
            const targetInput = document.getElementById('target-score-input').value;
            const targetScore = parseInt(targetInput);
            
            if(isNaN(targetScore) || targetScore <= 0) {
                return showCustomModal('Invalid Target', 'Please enter a valid target score greater than 0.', 'warning');
            }

            const inputs = document.querySelectorAll('.player-name-input');
            let tempPlayers = [];
            
            inputs.forEach((input, idx) => {
                const name = input.value.trim() || `Player ${idx + 1}`;
                tempPlayers.push({
                    id: `p_${idx}_${Date.now()}`,
                    name: name,
                    total: 0,
                    theme: themeColors[idx % themeColors.length]
                });
            });

            if (tempPlayers.length < 2) {
                return showCustomModal('Need Players', 'You need at least 2 players to start a match.', 'warning');
            }

            // Set state
            state = {
                isActive: true,
                targetScore: targetScore,
                players: tempPlayers,
                historyLog: [],
                winnerDeclared: false
            };

            saveState();
            
            document.getElementById('setup-view').classList.add('hidden');
            loadGameView();
        }

        function loadGameView() {
            const gameView = document.getElementById('game-view');
            gameView.classList.remove('hidden');
            gameView.classList.add('flex', 'fade-in');
            
            document.getElementById('display-target').innerText = state.targetScore;
            updateDashboard();
        }

        function updateDashboard() {
            document.getElementById('round-counter').innerText = state.historyLog.length + 1;
            
            if (state.historyLog.length > 0) {
                document.getElementById('undo-btn').classList.remove('hidden');
            } else {
                document.getElementById('undo-btn').classList.add('hidden');
            }

            renderScoreCards();
            renderHistory();
        }

        function renderScoreCards() {
            const grid = document.getElementById('score-cards-grid');
            grid.innerHTML = '';
            
            let maxScore = -Infinity;
            let hasPlayed = state.historyLog.length > 0;
            if (hasPlayed) {
                maxScore = Math.max(...state.players.map(p => p.total));
            }

            state.players.forEach(p => {
                const isLeader = hasPlayed && p.total === maxScore;
                
                const card = document.createElement('div');
                card.className = `glass-panel rounded-3xl p-5 flex flex-col items-center relative transition-all duration-300 ${isLeader ? 'leader-card' : 'border-white/5'}`;
                
                card.innerHTML = `
                    ${isLeader ? `<div class="absolute -top-4 bg-yellow-400 text-yellow-950 text-xs font-bold px-4 py-1.5 rounded-full shadow-[0_0_20px_rgba(250,204,21,0.6)] flex items-center gap-1.5 border border-yellow-300 z-10 slide-up"><i class="ph-fill ph-crown text-base"></i> Leader</div>` : ''}
                    
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${p.theme.grad} flex items-center justify-center font-bold text-white shadow-lg mb-3 mt-1 border border-white/20 text-xl">
                        ${p.name.substring(0, 2).toUpperCase()}
                    </div>
                    
                    <h3 class="text-slate-300 font-semibold text-lg truncate w-full text-center px-2">${p.name}</h3>
                    
                    <div class="text-4xl md:text-5xl font-black text-white my-4 tracking-tighter drop-shadow-md">
                        ${p.total}
                    </div>

                    <div class="w-full mt-auto relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 font-bold pointer-events-none group-focus-within:text-[${p.theme.hex}] transition-colors text-lg"><i class="ph-bold ph-plus"></i></div>
                        <input type="number" id="input-${p.id}" class="score-input w-full bg-slate-900 border border-slate-700/50 rounded-2xl py-4 pl-10 pr-4 text-center text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:border-[${p.theme.hex}] focus:bg-slate-800 transition-all shadow-inner" placeholder="0" autocomplete="off" onkeydown="if(event.key === 'Enter') submitScores()">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function submitScores() {
            let roundScores = [];
            let inputProvided = false;

            state.players.forEach(p => {
                const inputEl = document.getElementById(`input-${p.id}`);
                const val = parseInt(inputEl.value);
                const points = isNaN(val) ? 0 : val;
                if (!isNaN(val)) inputProvided = true;
                
                roundScores.push({
                    playerId: p.id,
                    pointsAdded: points,
                    runningTotal: p.total + points
                });
            });

            if (!inputProvided) return; 

            // Update State
            state.historyLog.push({
                round: state.historyLog.length + 1,
                scores: roundScores
            });

            state.players.forEach((p, i) => {
                p.total = roundScores[i].runningTotal;
            });

            saveState();
            updateDashboard();

            // Check Win Condition
            if (!state.winnerDeclared) {
                const winners = state.players.filter(p => p.total >= state.targetScore);
                if (winners.length > 0) {
                    state.winnerDeclared = true;
                    saveState();
                    
                    // Highest score among winners if multiple crossed target
                    const bestWinner = winners.reduce((prev, current) => (prev.total > current.total) ? prev : current);
                    triggerCelebration(bestWinner);
                }
            }

            // Auto-focus logic
            setTimeout(() => {
                const inputs = document.querySelectorAll('.score-input');
                if(inputs.length > 0) inputs[0].focus();
            }, 50);
        }

        function renderHistory() {
            const timeline = document.getElementById('history-timeline');
            document.getElementById('history-count').innerText = `${state.historyLog.length} Round${state.historyLog.length !== 1 ? 's' : ''}`;
            
            if (state.historyLog.length === 0) {
                timeline.innerHTML = `<div class="text-center py-10 text-slate-500 font-medium italic opacity-70">No points added yet.</div>`;
                return;
            }

            let headerHTML = `<div class="flex items-center gap-4 px-4 py-2 text-slate-400 text-sm font-semibold border-b border-white/5 pb-3 sticky top-0 bg-[var(--glass-bg)] z-10 backdrop-blur-md">
                <div class="w-16 shrink-0 text-center">Round</div>
                <div class="flex-grow grid" style="grid-template-columns: repeat(${state.players.length}, minmax(100px, 1fr)); gap: 1rem;">`;
            state.players.forEach(p => {
                headerHTML += `<div class="truncate text-center" style="color: ${p.theme.hex}">${p.name}</div>`;
            });
            headerHTML += `</div></div>`;

            let rowsHTML = '';
            
            for(let r = state.historyLog.length - 1; r >= 0; r--) {
                const roundData = state.historyLog[r];
                let scoresHTML = '';
                
                state.players.forEach(p => {
                    const pScore = roundData.scores.find(s => s.playerId === p.id);
                    const pts = pScore ? pScore.pointsAdded : 0;
                    const total = pScore ? pScore.runningTotal : 0;
                    
                    let sign = pts > 0 ? '+' : '';
                    let colorCls = pts > 0 ? 'text-emerald-400' : (pts < 0 ? 'text-rose-400' : 'text-slate-500');
                    let bgCls = pts > 0 ? 'bg-emerald-400/10 border-emerald-400/20' : (pts < 0 ? 'bg-rose-400/10 border-rose-400/20' : 'bg-slate-800/50 border-white/5');

                    scoresHTML += `
                        <div class="flex flex-col items-center justify-center p-2 rounded-xl border ${bgCls} transition-all hover:bg-white/5">
                            <span class="font-bold text-lg ${colorCls}">${sign}${pts}</span>
                            <span class="text-xs text-slate-400 font-medium mt-1">Total: ${total}</span>
                        </div>
                    `;
                });

                rowsHTML += `
                    <div class="flex items-center gap-4 px-4 py-3 bg-slate-800/20 rounded-2xl border border-white/5 hover:border-white/10 transition-colors">
                        <div class="w-16 shrink-0 flex flex-col items-center justify-center">
                            <span class="text-xs text-slate-500 font-bold uppercase tracking-wider mb-1">Rnd</span>
                            <span class="w-8 h-8 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-white font-bold shadow-inner">${roundData.round}</span>
                        </div>
                        <div class="flex-grow grid" style="grid-template-columns: repeat(${state.players.length}, minmax(100px, 1fr)); gap: 1rem;">
                            ${scoresHTML}
                        </div>
                    </div>
                `;
            }

            timeline.innerHTML = headerHTML + rowsHTML;
        }

        function undoLastRound() {
            if (state.historyLog.length === 0) return;

            const lastRound = state.historyLog.pop();
            
            state.players.forEach(p => {
                const playerRecord = lastRound.scores.find(s => s.playerId === p.id);
                if(playerRecord) p.total -= playerRecord.pointsAdded;
            });

            // Reset winner status if we undo below target
            if (state.winnerDeclared) {
                const anyWinners = state.players.some(p => p.total >= state.targetScore);
                if (!anyWinners) state.winnerDeclared = false;
            }

            saveState();
            updateDashboard();
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function confirmReset() {
            showCustomModal(
                'Clear Game?', 
                'Are you sure you want to end this match? All current scores and history will be deleted permanently.', 
                'danger',
                [
                    { text: 'Cancel', class: 'bg-slate-700 hover:bg-slate-600 text-white', action: closeModal },
                    { text: 'Yes, Clear Game', class: 'bg-rose-600 hover:bg-rose-500 text-white', action: executeReset }
                ]
            );
        }

        function executeReset() {
            localStorage.removeItem(STORAGE_KEY);
            state = { isActive: false, targetScore: 100, players: [], historyLog: [], winnerDeclared: false };
            
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('flex');
            
            closeModal();
            initApp();
        }

        function triggerCelebration(winner) {
            // Fire Confetti
            var duration = 4000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#38bdf8', '#facc15', '#f43f5e', '#34d399']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#38bdf8', '#facc15', '#f43f5e', '#34d399']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            // Show Winner Modal
            setTimeout(() => {
                showCustomModal(
                    '🏆 Winner!', 
                    `<strong class="text-xl text-[${winner.theme.hex}]">${winner.name}</strong> has reached the target score of ${state.targetScore}!`, 
                    'success',
                    [
                        { text: 'Keep Playing', class: 'bg-slate-700 hover:bg-slate-600 text-white', action: closeModal },
                        { text: 'New Game', class: 'bg-gradient-to-r from-yellow-500 to-orange-500 hover:from-yellow-400 hover:to-orange-400 text-white', action: executeReset }
                    ]
                );
            }, 1000);
        }

        // Custom Modal Controller
        function showCustomModal(title, message, type = 'info', buttons = []) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-message').innerHTML = message;
            
            // Set Icon
            const iconEl = document.getElementById('modal-icon');
            if(type === 'danger') {
                iconEl.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner bg-rose-500/20 text-rose-400 border border-rose-500/30';
                iconEl.innerHTML = '<i class="ph-bold ph-warning"></i>';
            } else if (type === 'success') {
                iconEl.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';
                iconEl.innerHTML = '<i class="ph-fill ph-confetti"></i>';
            } else if (type === 'warning') {
                iconEl.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner bg-amber-500/20 text-amber-400 border border-amber-500/30';
                iconEl.innerHTML = '<i class="ph-bold ph-info"></i>';
            } else {
                iconEl.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-5xl mb-6 shadow-inner bg-blue-500/20 text-blue-400 border border-blue-500/30';
                iconEl.innerHTML = '<i class="ph-bold ph-bell"></i>';
            }

            // Set Buttons
            const actionsContainer = document.getElementById('modal-actions');
            actionsContainer.innerHTML = '';
            
            if(buttons.length === 0) {
                // Default OK button
                buttons = [{ text: 'OK', class: 'bg-blue-600 hover:bg-blue-500 text-white w-full', action: closeModal }];
            }

            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = `px-6 py-3 rounded-xl font-bold transition-all shadow-lg active:scale-95 ${btn.class}`;
                b.innerText = btn.text;
                b.onclick = btn.action;
                actionsContainer.appendChild(b);
            });

            // Show
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.add('bounce-in');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            overlay.classList.add('opacity-0');
            content.classList.remove('bounce-in');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // Initialize on Load
        window.onload = initApp;
    </script>
</body>
</html>
