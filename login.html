<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login – Ma Achiya Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyA8wqh_981-ZkvjEDVq9TIRd8W085aLV9c",
            authDomain: "my-mess-1a367.firebaseapp.com",
            projectId: "my-mess-1a367",
            storageBucket: "my-mess-1a367.firebasestorage.app",
            messagingSenderId: "295199809694",
            appId: "1:295199809694:web:e7d7e45f2c1b6d67c05b8f",
            measurementId: "G-64TKSEFZSK"
        };
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.signIn = signInWithEmailAndPassword;
    </script>
    <style>
        :root { --font-primary: 'Inter', sans-serif; --font-bengali: 'Noto Sans Bengali', sans-serif; }
        [data-theme="dark"] {
            --bg: radial-gradient(circle at 50% 0%, #1a103c 0%, #0d0a1a 65%, #050508 100%);
            --glass-bg: rgba(20,18,35,0.75); --glass-border: rgba(255,255,255,0.1);
            --text: #fff; --text2: rgba(255,255,255,0.6); --accent: #a78bfa;
            --logo-border: #34d399; --green-glow: 0 0 25px rgba(52,211,153,0.4);
        }
        body { font-family: var(--font-primary); background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text); margin: 0; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 100%; max-width: 400px; padding: 30px 24px; }
        .logo-circle { width: 64px; height: 64px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(20px); border: 2px solid var(--logo-border); box-shadow: var(--green-glow); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; overflow: hidden; }
        .logo-text .bn { font-family: var(--font-bengali); font-size: 10px; font-weight: 800; line-height: 1.1; }
        .logo-text .en { font-size: 7.5px; font-weight: 600; color: var(--text2); }
        .input-box { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 16px; color: var(--text); margin-bottom: 14px; outline: none; }
        .input-box:focus { border-color: var(--accent); }
        .btn-submit { background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none; padding: 14px; border-radius: 14px; color: white; font-weight: 700; cursor: pointer; width: 100%; }
        .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 12px; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="glass">
    <div class="logo-circle">
        <div class="logo-text">
            <span class="bn">মা আছিয়া</span>
            <span class="en">VILLA</span>
        </div>
    </div>
    <h2 class="text-xl font-bold text-center mb-1">Manager Portal</h2>
    <p class="text-xs text-center mb-6" style="color:var(--text2);">Secure Login for Management</p>
    <form onsubmit="handleLogin(event)">
        <input type="email" id="email" class="input-box" placeholder="Email Address" required>
        <input type="password" id="password" class="input-box" placeholder="Password" required>
        <button type="submit" class="btn-submit mt-2">Login to Console →</button>
        <div id="errorMsg" class="error-msg"></div>
    </form>
    <div class="text-center mt-6">
        <a href="index.html" class="text-xs text-purple-300 hover:underline">← Back to Public Dashboard</a>
    </div>
</div>
<script>
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';
        try {
            await window.signIn(window.auth, email, password);
            if (email === 'spi@gmail.com') window.location.href = 'admin.html';
            else if (email === 'spi1@gmail.com') window.location.href = 'assistant.html';
            else window.location.href = 'admin.html';
        } catch(err) {
            errorEl.textContent = err.message;
            errorEl.style.display = 'block';
        }
    }
</script>
</body>
</html>
