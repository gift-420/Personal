<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — NAIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } }}}
</script>
<style>
body {
  background: radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  min-height: 100vh; color: #f3f8ff;
}
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
}
.input-lite {
  width: 100%; padding: 14px; border-radius: 12px;
  border: 1px solid rgba(200,230,255,.25);
  background: rgba(5,18,37,.62); color: #f4f9ff; font-weight: 700;
  font-size: 14px;
}
.input-lite:focus { outline: none; border-color: #67d9ff; box-shadow: 0 0 0 3px rgba(55,190,255,.17); }
</style>
</head>
<body class="antialiased flex items-center justify-center p-4">

<div class="glass rounded-3xl p-6 max-w-sm w-full">
  <div class="text-center mb-6">
    <div class="bg-blue-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-600/30">
      <i class="fas fa-shield-halved text-2xl text-white"></i>
    </div>
    <h1 id="title" class="text-2xl font-black text-white">Welcome Back</h1>
    <p id="subtitle" class="text-xs text-slate-400 mt-1">Login to your account</p>
  </div>

  <form id="auth-form">
    <input type="text" id="name" class="input-lite mb-3 hidden" placeholder="Full name">
    <input type="email" id="email" required class="input-lite mb-3" placeholder="Email" autocomplete="username">
    <input type="password" id="password" required minlength="6" class="input-lite mb-3" placeholder="Password (min 6 chars)" autocomplete="current-password">
    <p id="error" class="text-xs text-red-400 font-bold mb-3 hidden"></p>
    <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow-lg shadow-blue-600/30">
      <i class="fas fa-sign-in-alt mr-2"></i><span id="btn-text">Login</span>
    </button>
  </form>

  <button type="button" id="switch-mode" class="w-full mt-3 text-xs font-bold text-blue-400 hover:text-blue-300">
    New here? Create account
  </button>

  <a href="index.html" class="block text-center mt-4 text-xs text-slate-400 hover:text-white">
    ← Back to shop
  </a>
</div>

<script type="module">
import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, ADMIN_EMAIL, db, doc, setDoc, serverTimestamp } from './js/firebase.js';
import { showToast } from './js/ui.js';

const params = new URLSearchParams(location.search);
const nextPage = params.get('next') || null;

// Already logged in? Redirect based on role
onAuthStateChanged(auth, (user) => {
  if (user) {
    redirectUser(user);
  }
});

function redirectUser(user) {
  const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  if (nextPage && !isAdmin) {
    location.href = nextPage;
  } else if (isAdmin) {
    location.href = 'admin.html';
  } else {
    location.href = 'dashboard.html';
  }
}

let isSignup = false;
const form = document.getElementById('auth-form');
const nameEl = document.getElementById('name');
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const errEl = document.getElementById('error');
const titleEl = document.getElementById('title');
const subtitleEl = document.getElementById('subtitle');
const btnText = document.getElementById('btn-text');
const switchBtn = document.getElementById('switch-mode');

switchBtn.onclick = () => {
  isSignup = !isSignup;
  nameEl.classList.toggle('hidden', !isSignup);
  nameEl.required = isSignup;
  titleEl.textContent = isSignup ? 'Create Account' : 'Welcome Back';
  subtitleEl.textContent = isSignup ? 'Start shopping in seconds' : 'Login to your account';
  btnText.textContent = isSignup ? 'Create Account' : 'Login';
  switchBtn.textContent = isSignup ? 'Have an account? Login' : 'New here? Create account';
  errEl.classList.add('hidden');
};

form.onsubmit = async (e) => {
  e.preventDefault();
  errEl.classList.add('hidden');
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Please wait...';

  const email = emailEl.value.trim();
  const password = passEl.value;
  const name = nameEl.value.trim();

  try {
    if (isSignup) {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if (name) await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, createdAt: serverTimestamp()
      });
      showToast('Account created!', 'bg-green-600');
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      showToast('Welcome back!', 'bg-green-600');
    }
    // onAuthStateChanged handles redirect
  } catch (err) {
    const msgs = {
      'auth/email-already-in-use': 'Email already registered',
      'auth/weak-password': 'Password must be 6+ chars',
      'auth/invalid-credential': 'Wrong email or password',
      'auth/wrong-password': 'Wrong email or password',
      'auth/user-not-found': 'No account with this email',
      'auth/invalid-email': 'Invalid email'
    };
    errEl.textContent = msgs[err.code] || err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i><span>' + (isSignup ? 'Create Account' : 'Login') + '</span>';
  }
};
</script>
</body>
      </html>
