<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Ma Achiya Villa - Login
</title>


<script src="https://cdn.tailwindcss.com"></script>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>


*{
box-sizing:border-box;
}


body{


margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;


font-family:
'Inter',
sans-serif;


background:

radial-gradient(
circle at top,
#25135b,
#06060e 60%
);


color:white;


padding:20px;


}




.login-box{


width:100%;

max-width:380px;


background:

rgba(255,255,255,.08);


backdrop-filter:

blur(40px);


-webkit-backdrop-filter:

blur(40px);



border:

1px solid rgba(255,255,255,.15);


border-radius:30px;


padding:35px 25px;


box-shadow:

0 25px 70px rgba(0,0,0,.5);


}




.logo{


width:80px;

height:80px;


margin:auto;


border-radius:50%;


display:flex;

align-items:center;

justify-content:center;


text-align:center;


border:

2px solid #34d399;


box-shadow:

0 0 40px rgba(52,211,153,.5);


font-weight:800;


}



h1{


text-align:center;

margin-top:20px;


font-size:24px;


}




input{


width:100%;


padding:14px 16px;


margin-top:15px;


border-radius:18px;


border:

1px solid rgba(255,255,255,.15);



background:

rgba(255,255,255,.08);


color:white;


outline:none;


}




input:focus{


border-color:#60a5fa;


}




button{


width:100%;


margin-top:20px;


padding:14px;


border-radius:18px;


border:none;


font-weight:700;


background:

linear-gradient(
135deg,
#60a5fa,
#a78bfa
);


color:white;


cursor:pointer;


}




button:hover{


opacity:.9;


}



.role{


text-align:center;

margin-top:15px;

font-size:13px;

opacity:.7;

}



#error{


margin-top:15px;

text-align:center;

color:#f87171;

font-size:13px;

}



</style>


</head>



<body>



<div class="login-box">



<div class="logo">


<div>

মা আছিয়া

<br>

<span style="font-size:10px">

VILLA

</span>


</div>


</div>




<h1>
Manager Login
</h1>



<input

id="email"

type="email"

placeholder="Email address"



>



<input

id="password"

type="password"

placeholder="Password"



>



<button onclick="login()">

Login

</button>




<div class="role" id="roleText">

Loading role...

</div>



<div id="error"></div>



</div>







<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";



import {


getAuth,

signInWithEmailAndPassword


}

from

"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";





const firebaseConfig = {


apiKey:
"YOUR_API_KEY",


authDomain:
"my-mess-1a367.firebaseapp.com",


projectId:
"my-mess-1a367",


storageBucket:
"my-mess-1a367.firebasestorage.app",


messagingSenderId:
"295199809694",


appId:
"YOUR_APP_ID"


};




const app =
initializeApp(firebaseConfig);



const auth =
getAuth(app);






let params =
new URLSearchParams(
location.search
);



let role =
params.get("role") || "admin";




document.getElementById("roleText")
.innerHTML =
role==="assistant"

?

"👥 Assistant Access"

:

"👤 Manager Access";







window.login=function(){



let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;




signInWithEmailAndPassword(
auth,
email,
password

)

.then(()=>{


if(role==="assistant"){


location.href="assistant.html";


}

else{


location.href="admin.html";


}


})


.catch(e=>{


document.getElementById("error")
.innerHTML =
"Login failed. Check email/password";


});



}





</script>



</body>

</html>
