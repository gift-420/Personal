<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login – Ma Achiya Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCU0sucNd62U9aIcGGC3Tx7DW2tZNTvEVQ",
            authDomain: "smart-mess-8a136.firebaseapp.com",
            projectId: "smart-mess-8a136",
            storageBucket: "smart-mess-8a136.firebasestorage.app",
            messagingSenderId: "826713927112",
            appId: "1:826713927112:web:288afbe242e6865c5b64fd"
        };
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    </script>
    <style>
        :root {
            --font-primary: 'Inter', sans-serif;
            --font-bengali: 'Noto Sans Bengali', sans-serif;
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a103c 0%, #0d0a1a 65%, #050508 100%);
            --glass-bg: rgba(20, 18, 35, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #fff;
            --text2: rgba(255, 255, 255, 0.6);
            --accent: #a78bfa;
            --logo-border: #34d399;
            --green-glow: 0 0 25px rgba(52, 211, 153, 0.4);
            --error-color: #f87171;
        }
        [data-theme="light"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #e0d8f0 0%, #f0eef5 65%, #f2f2f7 100%);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text: #1c1c1e;
            --text2: rgba(0, 0, 0, 0.6);
            --accent: #7c3aed;
            --logo-border: #059669;
            --green-glow: 0 0 25px rgba(5, 150, 105, 0.3);
            --error-color: #dc2626;
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-gradient);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; color: var(--text); position: relative; margin: 0;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 60%, rgba(139,92,246,0.15) 0%, transparent 40%),
                        radial-gradient(circle at 75% 25%, rgba(59,130,246,0.12) 0%, transparent 40%);
            filter: blur(60px); pointer-events: none; z-index: 0;
        }
        .glass {
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; z-index: 1;
            width: 100%; max-width: 400px; padding: 30px 24px;
        }

        .logo-circle {
            width: 64px; height: 64px; border-radius: 50%; background: var(--glass-bg);
            backdrop-filter: blur(20px); border: 2px solid var(--logo-border);
            box-shadow: var(--green-glow); display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; overflow: hidden; line-height: 1; padding: 2px;
        }
        .logo-text { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; height: 100%; }
        .logo-text .bn { font-family: var(--font-bengali); font-size: 10px; font-weight: 800; color: var(--text); line-height: 1.1; }
        .logo-text .en { font-size: 7.5px; font-weight: 600; color: var(--text2); letter-spacing: 0.4px; line-height: 1.1; }

        .input-box {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px; padding: 14px 16px; color: var(--text); margin-bottom: 14px; outline: none;
        }
        .input-box:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

        .btn-submit {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9); border: none; padding: 14px;
            border-radius: 14px; color: white; font-weight: 700; cursor: pointer; width: 100%;
            box-shadow: 0 6px 20px rgba(139,92,246,0.4);
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }

        .tab {
            padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
            background: transparent; color: var(--text2); border: none;
        }
        .tab.active { background: #8b5cf6; color: #fff; }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error-message.show { display: block; }
    </style>
</head>
<body>
<div class="glass">
    <div class="logo-circle">
        <div class="logo-text">
            <span class="bn">মা আছিয়া</span>
            <span class="en">VILLA</span>
        </div>
    </div>
    <h2 class="text-xl font-bold text-center mb-1">Manager Portal</h2>
    <p class="text-xs text-center mb-6" style="color: var(--text2);">M M NAIME RAHMAN</p>

    <div class="grid grid-cols-2 gap-2 mb-5 p-1 bg-white/5 rounded-xl">
        <button class="tab active" id="tabAdmin" onclick="setRole('admin')">Main Manager</button>
        <button class="tab" id="tabAssistant" onclick="setRole('assistant')">Assistant</button>
    </div>

    <form onsubmit="handleLogin(event)">
        <input type="email" id="email" class="input-box" placeholder="Email Address" required>
        <input type="password" id="password" class="input-box" placeholder="Password" required>
        <button type="submit" class="btn-submit mt-2">Login to Console →</button>
        <div class="error-message" id="errorMsg">Invalid email or password. Try again.</div>
    </form>
    <div class="text-center mt-6">
        <a href="index.html" class="text-xs text-purple-300 hover:underline">← Back to Public Dashboard</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const roleFromUrl = urlParams.get('role');
    let selectedRole = 'admin';
    if (roleFromUrl === 'assistant') selectedRole = 'assistant';

    function setRole(role) {
        selectedRole = role;
        document.getElementById('tabAdmin').className = role === 'admin' ? 'tab active' : 'tab';
        document.getElementById('tabAssistant').className = role === 'assistant' ? 'tab active' : 'tab';
    }
    setRole(selectedRole);

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMsg');
        errorEl.classList.remove('show');

        try {
            await window.signInWithEmailAndPassword(window.auth, email, password);
            window.location.href = selectedRole === 'admin' ? 'admin.html' : 'assistant.html';
        } catch(err) {
            errorEl.textContent = err.message.replace('Firebase: ', '').replace(/\(auth\/.*\)\.?/, '');
            errorEl.classList.add('show');
            document.getElementById('password').value = '';
        }
    }
</script>
</body>
</html>
