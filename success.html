<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Order Success — NAIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } }}}
</script>
<style>
body {
  background: radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  min-height: 100vh; color: #f3f8ff;
}
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
  -webkit-backdrop-filter: blur(14px) saturate(145%);
}
@keyframes bounceIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
.bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
</style>
</head>
<body class="antialiased flex items-center justify-center p-4">

<div class="glass rounded-3xl p-6 max-w-sm w-full text-center bounce-in">
  <div class="w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-600 text-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/40">
    <i class="fas fa-check text-4xl"></i>
  </div>
  <h1 class="text-2xl font-black text-white mb-2">Order Submitted!</h1>
  <p class="text-sm text-slate-300 mb-4">Your order ID:</p>

  <div class="bg-slate-900 rounded-2xl p-4 mb-4 border border-white/10">
    <p id="order-id" class="text-lg font-black text-yellow-400 mb-2 break-all">ORD-...</p>
    <button id="copy-btn" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg font-bold text-white">
      <i class="fas fa-copy mr-1"></i>Copy
    </button>
  </div>

  <p class="text-xs text-slate-400 mb-4">Your screenshot + details have been sent to admin. You'll be notified when delivered.</p>

  <a href="dashboard.html" class="block w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl mb-2 shadow-lg shadow-blue-600/30">
    <i class="fas fa-box mr-1"></i> Go to Dashboard
  </a>
  <a href="index.html" class="block w-full py-2 text-sm text-slate-400 font-bold hover:text-white">
    Continue shopping
  </a>
</div>

<script type="module">
import { showToast, copyText } from './js/ui.js';

const params = new URLSearchParams(location.search);
const orderId = params.get('id') || 'Unknown';
document.getElementById('order-id').textContent = orderId;
document.getElementById('copy-btn').onclick = () => copyText(orderId, 'Order ID');
</script>
</body>
</html>
