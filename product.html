<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Product — NAIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brandDark: '#0f172a' } }}}
</script>
<style>
body {
  background: radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  background-attachment: fixed; min-height: 100vh; color: #f3f8ff;
}
::-webkit-scrollbar { display: none; }
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
  -webkit-backdrop-filter: blur(14px) saturate(145%);
}
.glass-nav { background: rgba(8,22,43,.78); border-bottom: 1px solid rgba(180,225,255,.2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.input-lite {
  width: 100%; padding: 12px; border-radius: 12px;
  border: 1px solid rgba(200,230,255,.25);
  background: rgba(5,18,37,.62); color: #f4f9ff; font-weight: 700;
  font-size: 14px;
}
.input-lite:focus { outline: none; border-color: #67d9ff; box-shadow: 0 0 0 3px rgba(55,190,255,.17); }
</style>
</head>
<body class="antialiased pb-10">

<header id="site-header"></header>

<main id="app" class="max-w-2xl mx-auto px-4 py-6">
  <div class="glass rounded-2xl p-6 text-center">
    <i class="fas fa-spinner fa-spin text-3xl text-blue-400"></i>
    <p class="mt-3 text-slate-300 text-sm">Loading product...</p>
  </div>
</main>

<script type="module">
import { db, getDoc, doc } from './js/firebase.js';
import { cachedProducts, formatPrice, saveDraft, loadDraft, currentRegion, REGIONS } from './js/store.js';
import { DEFAULT_PRODUCTS } from './js/products.js';
import { renderHeader, showToast, esc } from './js/ui.js';

renderHeader('product');

const id = Number(new URLSearchParams(location.search).get('id'));
let products = cachedProducts() || DEFAULT_PRODUCTS;

try {
  const snap = await getDoc(doc(db, 'settings', 'products'));
  if (snap.exists() && Array.isArray(snap.data().list)) {
    products = snap.data().list;
  }
} catch {}

const p = products.find(x => x.id === id);
const app = document.getElementById('app');

if (!p) {
  app.innerHTML = `
    <div class="glass rounded-2xl p-8 text-center">
      <i class="fas fa-exclamation-circle text-4xl text-red-400 mb-3"></i>
      <p class="text-lg font-black mb-2">Product not found</p>
      <p class="text-sm text-slate-400 mb-4">The product you're looking for does not exist.</p>
      <a href="index.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm">
        <i class="fas fa-arrow-left mr-1"></i> Back to shop
      </a>
    </div>`;
} else {
  const draft = loadDraft();
  const sameProduct = draft && draft.productId === p.id;
  let qty = sameProduct ? draft.quantity : 1;
  let customValue = sameProduct ? (draft.customValue || '') : '';

  function render() {
    app.innerHTML = `
      <a href="index.html" class="inline-flex items-center gap-2 text-slate-300 hover:text-white text-sm font-bold mb-4">
        <i class="fas fa-arrow-left"></i> Back to products
      </a>

      <div class="glass rounded-2xl p-5">
        <div class="flex items-center gap-4 mb-5">
          <div class="h-20 w-20 ${p.bg} rounded-2xl flex items-center justify-center shrink-0 shadow-lg">
            <i class="${p.icon} ${p.color} text-4xl"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h1 class="text-2xl font-black uppercase text-white leading-tight">${esc(p.title)}</h1>
            <p class="text-sm font-semibold text-slate-300">${esc(p.subtitle)}</p>
            <p class="text-2xl font-black text-blue-400 mt-1">${formatPrice(p.priceUSD)}</p>
          </div>
        </div>

        <div class="glass rounded-xl p-4 mb-5">
          <div class="flex items-center gap-2 mb-2">
            <i class="fas fa-info-circle text-blue-400"></i>
            <h2 class="font-black text-sm">Product Details</h2>
          </div>
          <p class="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap">${esc(p.details || 'No details available.')}</p>
        </div>

        ${p.inputType ? `
          <div class="mb-5">
            <label class="text-xs font-black text-blue-300 block mb-2">
              <i class="fas fa-edit mr-1"></i>${esc(p.inputLabel)} <span class="text-red-400">*</span>
            </label>
            <input type="text" id="custom-input" class="input-lite"
              placeholder="${esc(p.inputPlaceholder || '')}"
              value="${esc(customValue)}">
            <p class="text-[10px] text-slate-400 mt-1">এই তথ্য admin কে পাঠানো হবে।</p>
          </div>
        ` : ''}

        <div class="flex items-center justify-between mb-5">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Quantity</p>
            <div class="flex items-center gap-3">
              <button id="minus" class="w-10 h-10 rounded-xl bg-white/10 border border-white/20 font-black text-xl text-white hover:bg-white/20">−</button>
              <span id="qty" class="font-black text-xl w-10 text-center">${qty}</span>
              <button id="plus" class="w-10 h-10 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-xl">+</button>
            </div>
          </div>
          <div class="text-right">
            <p class="text-xs font-bold text-slate-400 uppercase mb-1">Total</p>
            <p id="total" class="text-2xl font-black text-blue-400">${formatPrice(p.priceUSD, qty)}</p>
          </div>
        </div>

        <button id="go" class="w-full py-4 text-base font-black text-white bg-blue-600 hover:bg-blue-700 rounded-2xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
          <i class="fas fa-shopping-cart"></i> Continue to Checkout →
        </button>

        <div class="mt-4 text-center">
          <p class="text-[10px] text-slate-400">
            <i class="fas fa-shield-halved mr-1"></i>
            Secure checkout · Draft saved automatically
          </p>
        </div>
      </div>
    `;

    document.getElementById('minus').onclick = () => { if (qty > 1) { qty--; render(); } };
    document.getElementById('plus').onclick = () => { if (qty < 10) { qty++; render(); } };

    const ci = document.getElementById('custom-input');
    if (ci) ci.oninput = () => { customValue = ci.value; };

    document.getElementById('go').onclick = () => {
      if (p.inputType && !customValue.trim()) {
        return showToast(p.inputLabel + ' required', 'bg-red-600');
      }
      saveDraft({
        productId: p.id,
        productTitle: p.title,
        priceUSD: p.priceUSD,
        quantity: qty,
        customValue: customValue.trim() || null,
        customLabel: p.inputType ? p.inputLabel : null,
        savedAt: Date.now()
      });
      location.href = 'checkout.html';
    };
  }
  render();
}
</script>
</body>
  </html>
