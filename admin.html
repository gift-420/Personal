<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Console  Ma Achiya Villa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-primary: 'Inter', sans-serif;
            --font-bengali: 'Noto Sans Bengali', sans-serif;
            --glass-bg: rgba(18, 18, 40, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: var(--font-primary);
            background: radial-gradient(ellipse 90% 70% at 50% -30%, #1a1040 0%, #0d0d20 40%, #06060e 70%);
            min-height: 100vh; margin: 0; padding: 24px 16px; color: #fff;
            position: relative;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 60%, #a78bfa 0%, transparent 35%),
                        radial-gradient(circle at 75% 25%, #60a5fa 0%, transparent 35%);
            opacity: 0.2; filter: blur(80px); pointer-events: none; z-index: 0;
        }
        
        .glass-container {
            background: var(--glass-bg); backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 20px; margin-bottom: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
            position: relative; z-index: 10;
        }

        .logo-circle {
            width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.05);
            border: 2px solid #34d399; box-shadow: 0 0 20px rgba(52,211,153,0.3);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        
        .input-glass {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 12px 14px; color: #fff; font-size: 14px;
            margin-bottom: 10px; outline: none; transition: 0.3s;
        }
        .input-glass:focus { border-color: #a78bfa; background: rgba(255,255,255,0.08); }
        select.input-glass option { background: #1a103c; color: #fff; }

        .btn-push {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 12px 18px; border-radius: 14px;
            color: white; font-weight: 700; font-size: 14px; cursor: pointer;
            width: 100%; box-shadow: 0 4px 15px rgba(139,92,246,0.35);
            transition: all 0.2s ease;
        }
        .btn-push:active { transform: translateY(2px); }
        .btn-success { background: linear-gradient(135deg, #34d399, #059669) !important; pointer-events: none; }

        .stat-card {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 14px 8px; text-align: center;
        }
    </style>
</head>
<body>
<div class="max-w-md mx-auto relative z-10" id="mainApp" style="display: none;">
    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
            <div class="logo-circle">
                <span class="text-[9px] font-bold font-bengali"> </span>
                <span class="text-[7px] font-bold text-gray-400">VILLA</span>
            </div>
            <div>
                <h1 class="text-lg font-bold">Manager Console</h1>
                <p id="userEmail" class="text-xs text-gray-400"></p>
            </div>
        </div>
        <div class="flex flex-col gap-2">
            <a href="index.html" class="px-3 py-1.5 text-xs font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/20 rounded-xl text-center hover:bg-blue-500/20"> Home</a>
            <button onclick="handleLogout()" class="px-3 py-1.5 text-xs font-semibold text-red-400 bg-red-500/10 border border-red-500/20 rounded-xl hover:bg-red-500/20"> Logout</button>
        </div>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-3 gap-2 mb-5">
        <div class="stat-card">
            <div class="text-[10px] text-gray-400 uppercase font-semibold">Meal Rate</div>
            <div class="text-lg font-bold text-purple-400" id="mealRate">0.00</div>
        </div>
        <div class="stat-card">
            <div class="text-[10px] text-gray-400 uppercase font-semibold">Total Meals</div>
            <div class="text-lg font-bold text-blue-400" id="totalMeals">0</div>
        </div>
        <div class="stat-card">
            <div class="text-[10px] text-gray-400 uppercase font-semibold">Total Bazar</div>
            <div class="text-lg font-bold text-emerald-400" id="totalBazar">0</div>
        </div>
    </div>

    <!-- 1. Manager Designation -->
    <div class="glass-container">
        <div class="flex items-center gap-2 mb-3 text-sm font-semibold text-gray-300"> Update Manager Name</div>
        <input type="text" id="managerNameInput" class="input-glass" placeholder="Enter manager name">
        <button id="btnManagerName" class="btn-push" onclick="updateManagerName()"> Save Name</button>
    </div>

    <!-- 2. Add New Border -->
    <div class="glass-container">
        <div class="flex items-center gap-2 mb-3 text-sm font-semibold text-gray-300"> Add New Border</div>
        <input type="text" id="newMemberName" class="input-glass" placeholder="Member full name">
        <input type="number" id="newMemberDeposit" class="input-glass" placeholder="Initial deposit ()">
        <button id="btnAddMember" class="btn-push" onclick="addMember()"> Register Border</button>
    </div>

    <!-- 3. Deposit Ledger -->
    <div class="glass-container">
        <div class="flex items-center gap-2 mb-3 text-sm font-semibold text-gray-300"> Deposit Ledger Entry</div>
        <select id="memberSelect" class="input-glass"><option value="">Select border...</option></select>
        <input type="number" id="depositAmount" class="input-glass" placeholder="Amount ()">
        <button id="btnDeposit" class="btn-push" onclick="addDeposit()"> Record Payment</button>
    </div>

    <!-- 4. Bazar Expense Log -->
    <div class="glass-container">
        <div class="flex items-center gap-2 mb-3 text-sm font-semibold text-gray-300"> Bazar Expense Log</div>
        <input type="date" id="bazarDate" class="input-glass">
        <input type="text" id="purchaser" class="input-glass" placeholder="Purchaser name">
        <input type="number" id="bazarAmount" class="input-glass" placeholder="Total cost ()">
        <button id="btnBazar" class="btn-push" onclick="addBazar()"> Commit Expense</button>
    </div>

    <!-- 5. Security -->
    <div class="glass-container">
        <div class="flex items-center gap-2 mb-3 text-sm font-semibold text-gray-300"> Change Password</div>
        <input type="password" id="oldPassword" class="input-glass" placeholder="Current password">
        <input type="password" id="newPassword" class="input-glass" placeholder="New password">
        <button id="btnPassword" class="btn-push" onclick="changePassword()"> Update Password</button>
    </div>
</div>

<!-- Loading Screen -->
<div id="loadingScreen" class="fixed inset-0 flex items-center justify-center bg-[#06060e] z-50 text-white flex-col">
    <div class="w-10 h-10 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-3"></div>
    <p class="text-sm text-gray-400 tracking-wider">Verifying Access...</p>
</div>

<!-- Firebase System Module -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, getDoc, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyCp839knqRqJvkVOxOS2-MvD3KnnSL-Mio",
        authDomain: "my-mess-1c3a2.firebaseapp.com",
        projectId: "my-mess-1c3a2",
        storageBucket: "my-mess-1c3a2.firebasestorage.app",
        messagingSenderId: "148513277951",
        appId: "1:148513277951:web:411615103ce47405efc9ca",
        measurementId: "G-XCNMLEETXH"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUser = null;

    // 1. Check Authentication Status
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.replace('login.html?role=admin');
            return;
        }
        currentUser = user;
        document.getElementById('userEmail').textContent = user.email;
        
        // Load data then show UI
        await loadAllData();
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    });

    // 2. Data Loading Functions
    async function loadAllData() {
        await loadManagerName();
        await refreshStatsAndDropdown();
    }

    async function loadManagerName() {
        const snap = await getDoc(doc(db, 'settings', 'manager'));
        if (snap.exists()) document.getElementById('managerNameInput').value = snap.data().name || '';
    }

    async function refreshStatsAndDropdown() {
        // Fetch Members
        const membersSnap = await getDocs(collection(db, 'members'));
        let totalMeals = 0;
        let options = '<option value="">Select border...</option>';
        
        membersSnap.forEach(document => {
            const d = document.data();
            totalMeals += (parseFloat(d.totalMeals) || 0);
            options += `<option value="${document.id}">${d.name} (Deposit: ${d.totalDeposit || 0})</option>`;
        });
        
        document.getElementById('memberSelect').innerHTML = options;
        document.getElementById('totalMeals').textContent = totalMeals;

        // Fetch Bazar
        const bazarSnap = await getDocs(collection(db, 'bazar'));
        let totalBazar = 0;
        bazarSnap.forEach(d => totalBazar += (parseFloat(d.data().amount) || 0));
        document.getElementById('totalBazar').textContent = '' + totalBazar;

        // Calculate Rate
        const rate = totalMeals > 0 ? (totalBazar / totalMeals) : 0;
        document.getElementById('mealRate').textContent = '' + rate.toFixed(2);
        
        // Save rate globally for index page
        await setDoc(doc(db, 'settings', 'mealRate'), { rate: rate }, { merge: true });
    }

    // Utility: Show button success animation
    function showSuccess(buttonId) {
        const btn = document.getElementById(buttonId);
        const originalText = btn.innerHTML;
        btn.classList.add('btn-success');
        btn.innerHTML = ' Saved Successfully';
        setTimeout(() => {
            btn.classList.remove('btn-success');
            btn.innerHTML = originalText;
        }, 1500);
    }

    // 3. Action Functions (Attached to window for HTML access)
    
    window.updateManagerName = async () => {
        const newName = document.getElementById('managerNameInput').value.trim();
        if (!newName) return alert('Please enter a name');
        try {
            await setDoc(doc(db, 'settings', 'manager'), { name: newName }, { merge: true });
            showSuccess('btnManagerName');
        } catch(e) { alert("Error: " + e.message); }
    };

    window.addMember = async () => {
        const name = document.getElementById('newMemberName').value.trim();
        const deposit = parseFloat(document.getElementById('newMemberDeposit').value) || 0;
        if (!name) return alert('Enter member name');
        
        try {
            await addDoc(collection(db, 'members'), {
                name: name,
                totalDeposit: deposit,
                totalMeals: 0,
                createdAt: serverTimestamp()
            });
            document.getElementById('newMemberName').value = '';
            document.getElementById('newMemberDeposit').value = '';
            showSuccess('btnAddMember');
            await refreshStatsAndDropdown(); // Reload dropdown
        } catch(e) { alert("Error: " + e.message); }
    };

    window.addDeposit = async () => {
        const memberId = document.getElementById('memberSelect').value;
        const amount = parseFloat(document.getElementById('depositAmount').value);
        if (!memberId || isNaN(amount) || amount <= 0) return alert('Select border and valid amount');
        
        try {
            const ref = doc(db, 'members', memberId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return alert('Member not found');
            
            const currentDeposit = parseFloat(snap.data().totalDeposit) || 0;
            await updateDoc(ref, { totalDeposit: currentDeposit + amount });
            
            document.getElementById('depositAmount').value = '';
            showSuccess('btnDeposit');
            await refreshStatsAndDropdown(); // Reload balances
        } catch(e) { alert("Error: " + e.message); }
    };

    window.addBazar = async () => {
        const date = document.getElementById('bazarDate').value;
        const purchaser = document.getElementById('purchaser').value.trim();
        const amount = parseFloat(document.getElementById('bazarAmount').value);
        if (!date || !purchaser || isNaN(amount) || amount <= 0) return alert('Fill all fields correctly');
        
        try {
            await addDoc(collection(db, 'bazar'), {
                date: date,
                purchaser: purchaser,
                amount: amount,
                timestamp: serverTimestamp()
            });
            document.getElementById('bazarDate').value = '';
            document.getElementById('purchaser').value = '';
            document.getElementById('bazarAmount').value = '';
            showSuccess('btnBazar');
            await refreshStatsAndDropdown(); // Reload total bazar cost
        } catch(e) { alert("Error: " + e.message); }
    };

    window.changePassword = async () => {
        const oldPass = document.getElementById('oldPassword').value;
        const newPass = document.getElementById('newPassword').value;
        if (!oldPass || !newPass) return alert('Enter both passwords');
        if (newPass.length < 6) return alert('New password must be at least 6 characters');
        
        try {
            const credential = EmailAuthProvider.credential(currentUser.email, oldPass);
            await reauthenticateWithCredential(currentUser, credential);
            await updatePassword(currentUser, newPass);
            
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            showSuccess('btnPassword');
            alert('Password changed successfully! You will remain logged in.');
        } catch(e) { 
            alert("Error: Incorrect current password or system error.");
            console.error(e);
        }
    };

    window.handleLogout = async () => {
        await signOut(auth);
        window.location.replace('login.html?role=admin');
    };
</script>
</body>
</html>
