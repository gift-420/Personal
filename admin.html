<!-- ================= MEMBER MANAGEMENT ================= -->

<div class="glass p-5 mb-6">

<h2 class="font-bold text-lg mb-4">
👥 Member Management
</h2>


<div class="grid gap-3">

id="memberName"

id="memberDeposit"
type="number"
class="btn"

➕ Add Member

<div class="glass p-5 mb-6">

📋 Members List

</h2>

class="space-y-3">


Loading...


</div>


</div>






<script type="module">


import {

collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc

}

from 
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";




const memberList =
document.getElementById(
"adminMemberList"
);






// ADD MEMBER


window.addMember = async function(){


let name =
document.getElementById(
"memberName"
).value.trim();



let deposit =
Number(
document.getElementById(
"memberDeposit"
).value || 0
);



if(!name){

alert(
"Enter Member Name"
);

return;

}



try{


await addDoc(

collection(
window.db,
"members"
),

{


name:name,


totalMeals:0,


totalDeposit:deposit,


createdAt:
new Date()

}

);



alert(
"Member Added"
);



document.getElementById(
"memberName"
).value="";


document.getElementById(
"memberDeposit"
).value="";



loadMembers();



}

catch(e){


console.log(e);


alert(
"Save Error"
);


}



}







// LOAD MEMBERS


async function loadMembers(){



let html="";



const snap =
await getDocs(

collection(
window.db,
"members"

)

);



let count=0;



snap.forEach(item=>{


count++;


let m =
item.data();



html+=`


<div class="glass p-4 flex justify-between items-center">


<div>


<h3 class="font-bold">

${m.name || "No Name"}

</h3>


<p class="small">

Deposit:
৳${m.totalDeposit || 0}

<br>

Meals:
${m.totalMeals || 0}

</p>


</div>




<div class="flex gap-2">


<button

class="btn"

onclick="addDeposit('${item.id}')">

💰

</button>



<button

class="btn"

onclick="deleteMember('${item.id}')">

🗑️

</button>


</div>


</div>


`;



});





memberList.innerHTML =
html || "No Members";



document.getElementById(
"memberCount"
).innerHTML=count;



}








// ADD DEPOSIT


window.addDeposit =
async function(id){


let amount =
prompt(
"Deposit Amount"
);



if(!amount)
return;



let ref =
doc(
window.db,
"members",
id
);



const snap =
await getDocs(
collection(
window.db,
"members"
)
);



let old=0;



snap.forEach(x=>{

if(x.id===id){

old =
Number(
x.data().totalDeposit || 0
);

}

});



await updateDoc(

ref,

{

totalDeposit:
old + Number(amount)

}

);



loadMembers();


}








// DELETE MEMBER


window.deleteMember =
async function(id){


let ok =
confirm(
"Delete Member?"
);



if(!ok)
return;



await deleteDoc(

doc(
window.db,
"members",
id

)

);



loadMembers();


}






// INITIAL LOAD


setTimeout(

loadMembers,

1500

);



</script>

<script type="module">


import {

collection,
addDoc,
getDocs,
doc,
setDoc

}

from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";





const bazarList =
document.getElementById(
"adminBazarList"
);







// ADD BAZAR


window.addBazar =
async function(){



let date =
document.getElementById(
"bazarDate"
).value;



let person =
document.getElementById(
"bazarPerson"
).value;



let amount =
Number(
document.getElementById(
"bazarAmount"
).value || 0
);



if(!date || !person || !amount){

alert(
"Fill all fields"
);

return;

}




await addDoc(

collection(
window.db,
"bazar"
),

{


date:date,

purchaser:person,

amount:amount,


createdAt:
new Date()


}

);



alert(
"Bazar Saved"
);



loadBazar();



}









// LOAD BAZAR


async function loadBazar(){



let html="";



const snap =
await getDocs(

collection(
window.db,
"bazar"

)

);



snap.forEach(item=>{


let b =
item.data();



html+=`

<div class="glass p-3">


<b>

${b.date}

</b>


<br>


${b.purchaser}


<span style="float:right">

৳${b.amount}

</span>


</div>


`;



});



bazarList.innerHTML =
html || "No Bazar";



}

document.getElementById(
"managerInput"
).value;



await setDoc(

doc(
window.db,
"settings",
"manager"

),

{

name:name

}

);



alert(
"Manager Updated"
);


}

}







setTimeout(

loadBazar,

);



</script>

<div class="glass p-5 mb-6">

<h2 class="font-bold text-lg mb-4">
🍽️ Daily Meal Entry
</h2>


<div class="mb-4">

<input 
id="mealDate"
type="date"
class="btn w-full">

</div>



<div id="mealMemberList"
class="space-y-3">

Loading Members...

</div>



<button
onclick="saveMealSheet()"
class="btn w-full mt-4">

💾 Save Today's Meal

</button>


</div>





<script type="module">


import {

collection,
getDocs,
doc,
setDoc

}

from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";





let mealMembers=[];







async function loadMealMembers(){



let html="";



const snap =
await getDocs(

collection(
window.db,
"members"

)

);



mealMembers=[];



snap.forEach(item=>{


let m =
item.data();



mealMembers.push({

id:item.id,

name:m.name

});



html+=`

<div class="glass p-4">


<div class="font-bold mb-3">

${m.name}

</div>



<div class="flex gap-4">


<label>

<input 
type="checkbox"
id="${item.id}_b">

Breakfast

</label>



<label>

<input 
type="checkbox"
id="${item.id}_l">

Lunch

</label>




<label>

<input 
type="checkbox"
id="${item.id}_d">

Dinner

</label>



</div>



</div>


`;



});



document.getElementById(
"mealMemberList"
).innerHTML =
html || "No Members";



}









// SAVE MEAL


window.saveMealSheet =
async function(){



let date =
document.getElementById(
"mealDate"
).value;



if(!date){

alert(
"Select Date"
);

return;

}



let members={};





mealMembers.forEach(m=>{


members[m.id]={


breakfast:
document.getElementById(
m.id+"_b"
).checked,



lunch:
document.getElementById(
m.id+"_l"
).checked,



dinner:
document.getElementById(
m.id+"_d"
).checked


};



});







await setDoc(

doc(
window.db,
"meals",
date

),

{


members:members,


updatedAt:
new Date()


}

);




alert(
"Meal Saved"
);



}







// LOAD DEFAULT DATE


document.getElementById(
"mealDate"
).value =
new Date()
.toISOString()
.split("T")[0];




setTimeout(
loadMealMembers,
1500
);



</script>
