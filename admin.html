<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Console – Ma Achiya Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, getDoc, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyA8wqh_981-ZkvjEDVq9TIRd8W085aLV9c",
            authDomain: "my-mess-1a367.firebaseapp.com",
            projectId: "my-mess-1a367",
            storageBucket: "my-mess-1a367.firebasestorage.app",
            messagingSenderId: "295199809694",
            appId: "1:295199809694:web:a78530334d571608c05b8f",
            measurementId: "G-RWHJKGV5LS"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.db = db; window.auth = auth;
        window.FirebaseSDK = { 
            collection, addDoc, updateDoc, doc, getDoc, getDocs, setDoc, 
            serverTimestamp, signOut, updatePassword, EmailAuthProvider, 
            reauthenticateWithCredential, onAuthStateChanged 
        };
    </script>
    <style>
        :root {
            --font-primary: 'Inter', sans-serif;
            --font-bengali: 'Noto Sans Bengali', 'Vrinda', 'Bangla Sangam MN', sans-serif;
            --font-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            --ease-smooth: cubic-bezier(0.25,0.1,0.25,1);
            --radius-sm: 12px; --radius-md: 18px; --radius-lg: 24px; --radius-xl: 32px; --radius-full: 9999px;
        }
        [data-theme="dark"] {
            --bg-gradient: radial-gradient(ellipse 90% 70% at 50% -30%, #1a1040 0%, #0d0d20 40%, #06060e 70%);
            --glass-bg: rgba(18,18,40,0.55);
            --glass-bg-light: rgba(25,25,50,0.35);
            --glass-border: rgba(255,255,255,0.1);
            --text: #fff;
            --text2: rgba(255,255,255,0.7);
            --text3: rgba(255,255,255,0.5);
            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-red: #f87171;
            --logo-border: #34d399;
            --logo-border-glow: rgba(52,211,153,0.5);
            --divider: rgba(255,255,255,0.06);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        [data-theme="light"] {
            --bg-gradient: radial-gradient(ellipse 90% 70% at 50% -30%, #e0d8f0 0%, #f0eef5 40%, #f2f2f7 70%);
            --glass-bg: rgba(255,255,255,0.65);
            --glass-bg-light: rgba(255,255,255,0.45);
            --glass-border: rgba(0,0,0,0.08);
            --text: #1c1c1e;
            --text2: rgba(0,0,0,0.6);
            --text3: rgba(0,0,0,0.4);
            --accent-purple: #7c3aed;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --logo-border: #059669;
            --logo-border-glow: rgba(5,150,105,0.35);
            --divider: rgba(0,0,0,0.06);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
        }

        body {
            font-family: var(--font-primary);
            background: var(--bg-gradient); min-height: 100vh; margin: 0; padding: 24px 16px; color: var(--text);
            transition: background 0.4s, color 0.4s; position: relative;
            -webkit-font-smoothing: antialiased;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 20% 60%, var(--accent-purple) 0%, transparent 35%),
                        radial-gradient(circle at 75% 25%, var(--accent-blue) 0%, transparent 35%);
            opacity: 0.3; filter: blur(80px); pointer-events: none; z-index: 0;
        }

        .glass-container {
            background: var(--glass-bg); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
            padding: 20px; margin-bottom: 18px; box-shadow: var(--glass-shadow);
            position: relative; z-index: 1;
        }

        .logo-circle {
            width: 52px; height: 52px; border-radius: 50%; background: var(--glass-bg); backdrop-filter: blur(30px);
            border: 2px solid var(--logo-border); box-shadow: 0 0 20px var(--logo-border-glow);
            display: flex; align-items: center; justify-content: center; margin-right: 12px;
            overflow: hidden; line-height: 1;
        }
        .logo-text { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; width: 100%; padding: 2px; font-family: var(--font-bengali); }
        .logo-text .logo-bn { font-size: 10px; font-weight: 800; color: var(--text); font-family: var(--font-bengali); }
        .logo-text .logo-en { font-size: 7px; font-weight: 700; color: var(--text3); letter-spacing: 0.5px; font-family: var(--font-primary); }

        .section-heading {
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
            font-size: 14px; font-weight: 600; color: var(--text2);
        }
        .section-icon { font-family: var(--font-emoji); font-size: 18px; }

        .input-glass {
            width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 12px 14px; color: var(--text); font-size: 14px;
            margin-bottom: 10px; outline: none; font-family: var(--font-primary);
        }
        .input-glass:focus { border-color: var(--accent-purple); }
        select.input-glass option { background: #1a103c; color: #fff; }
        [data-theme="light"] select.input-glass option { background: #f0f0f5; color: #1c1c1e; }

        .btn-push {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 12px 18px; border-radius: 30px;
            color: white; font-weight: 700; font-size: 14px; cursor: pointer;
            width: 100%; box-shadow: 0 5px 0 #4c1d95, 0 8px 18px rgba(139,92,246,0.35);
            transition: all 0.1s ease; transform: translateY(0);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-push:active {
            box-shadow: 0 2px 0 #4c1d95, 0 4px 12px rgba(139,92,246,0.3);
            transform: translateY(4px);
        }
        .btn-success {
            background: linear-gradient(135deg, #34d399, #059669) !important;
            box-shadow: 0 5px 0 #047857, 0 8px 18px rgba(52,211,153,0.35) !important;
            pointer-events: none;
        }

        .stat-card {
            background: var(--glass-bg-light); backdrop-filter: blur(20px);
            border-radius: 18px; padding: 14px 8px; text-align: center;
            border: 1px solid var(--glass-border);
        }

        .btn-home, .btn-logout {
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; text-decoration: none; border: 1px solid;
            display: inline-flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .btn-home { background: rgba(96,165,250,0.1); border-color: rgba(96,165,250,0.3); color: #60a5fa; margin-right: 6px; }
        .btn-logout { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: #f87171; }
        .btn-home:hover { background: rgba(96,165,250,0.2); border-color: #60a5fa; }
        .btn-logout:hover { background: rgba(248,113,113,0.2); border-color: #f87171; }

        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .btn-push { font-size: 13px; padding: 11px 14px; }
            .glass-container { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="max-w-md mx-auto relative z-10">
    <div class="flex items-center justify-between mb-5">
        <div class="flex items-center gap-3">
            <div class="logo-circle">
                <div class="logo-text">
                    <span class="logo-bn">মা আছিয়া</span>
                    <span class="logo-en">VILLA</span>
                </div>
            </div>
            <div>
                <h1 class="text-lg font-bold">Manager Console</h1>
                <p id="userEmail" class="text-xs" style="color: var(--text3);"></p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="btn-home"><span style="font-family:var(--font-emoji);">🏠</span> Home</a>
            <button class="btn-logout" onclick="window.AppConsole.handleLogout()">↪️ Logout</button>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-5">
        <div class="stat-card"><div class="text-xs" style="color:var(--text3);">Meal Rate</div><div class="text-lg font-bold" style="color:var(--accent-purple);" id="mealRate">৳0.00</div></div>
        <div class="stat-card"><div class="text-xs" style="color:var(--text3);">Total Meals</div><div class="text-lg font-bold" style="color:var(--accent-blue);" id="totalMeals">0</div></div>
        <div class="stat-card"><div class="text-xs" style="color:var(--text3);">Total Bazar</div><div class="text-lg font-bold" style="color:var(--accent-green);" id="totalBazar">৳0</div></div>
    </div>

    <!-- Manager Designation -->
    <div class="glass-container">
        <div class="section-heading"><span class="section-icon">✏️</span> Manager Designation</div>
        <input type="text" id="managerNameInput" class="input-glass" placeholder="Enter manager name">
        <button id="btnManagerName" class="btn-push" onclick="window.AppConsole.updateManagerName()"><span style="font-family:var(--font-emoji);">💾</span> Save Name</button>
    </div>

    <!-- Add New Border -->
    <div class="glass-container">
        <div class="section-heading"><span class="section-icon">👤</span> Add New Border</div>
        <input type="text" id="newMemberName" class="input-glass" placeholder="Member full name">
        <input type="number" id="newMemberDeposit" class="input-glass" placeholder="Initial deposit (৳)">
        <button id="btnAddMember" class="btn-push" onclick="window.AppConsole.addMember()"><span style="font-family:var(--font-emoji);">➕</span> Register Border</button>
    </div>

    <!-- Deposit Ledger -->
    <div class="glass-container">
        <div class="section-heading"><span class="section-icon">💳</span> Deposit Ledger Entry</div>
        <select id="memberSelect" class="input-glass"><option value="">Select border...</option></select>
        <input type="number" id="depositAmount" class="input-glass" placeholder="Amount (৳)">
        <button id="btnDeposit" class="btn-push" onclick="window.AppConsole.addDeposit()"><span style="font-family:var(--font-emoji);">💰</span> Record Payment</button>
    </div>

    <!-- Bazar Expense Log -->
    <div class="glass-container">
        <div class="section-heading"><span class="section-icon">🛒</span> Bazar Expense Log</div>
        <input type="date" id="bazarDate" class="input-glass">
        <input type="text" id="purchaser" class="input-glass" placeholder="Purchaser name">
        <input type="number" id="bazarAmount" class="input-glass" placeholder="Total cost (৳)">
        <button id="btnBazar" class="btn-push" onclick="window.AppConsole.addBazar()"><span style="font-family:var(--font-emoji);">📋</span> Commit Expense</button>
    </div>

    <!-- Security -->
    <div class="glass-container">
        <div class="section-heading"><span class="section-icon">🔐</span> Change Password</div>
        <input type="password" id="oldPassword" class="input-glass" placeholder="Current password">
        <input type="password" id="newPassword" class="input-glass" placeholder="New password">
        <button id="btnPassword" class="btn-push" onclick="window.AppConsole.changePassword()"><span style="font-family:var(--font-emoji);">🔑</span> Update Password</button>
    </div>
</div>

<script>
    class EnterpriseConsole {
        constructor() {
            this.db = window.db;
            this.auth = window.auth;
            this.currentUser = null;
            this.init();
        }
        init() {
            window.FirebaseSDK.onAuthStateChanged(this.auth, async (user) => {
                if (!user) {
                    window.location.replace('login.html');
                    return;
                }
                this.currentUser = user;
                document.getElementById('userEmail').textContent = user.email;
                await this.loadAllData();
            });
        }
        async loadAllData() {
            await this.loadMemberDropdown();
            await this.refreshStats();
            await this.loadManagerName();
        }
        async loadMemberDropdown() {
            const snap = await window.FirebaseSDK.getDocs(window.FirebaseSDK.collection(this.db, 'members'));
            const select = document.getElementById('memberSelect');
            let options = '<option value="">Select border...</option>';
            snap.forEach(doc => { const d = doc.data(); options += `<option value="${doc.id}">${d.name} (৳${d.totalDeposit || 0})</option>`; });
            select.innerHTML = options;
        }
        async loadManagerName() {
            const snap = await window.FirebaseSDK.getDoc(window.FirebaseSDK.doc(this.db, 'settings', 'manager'));
            if (snap.exists()) document.getElementById('managerNameInput').value = snap.data().name || '';
        }
        async refreshStats() {
            const { getDocs, collection, doc, setDoc } = window.FirebaseSDK;
            const membersSnap = await getDocs(collection(this.db, 'members'));
            let totalMeals = 0; membersSnap.forEach(d => totalMeals += (d.data().totalMeals || 0));
            document.getElementById('totalMeals').textContent = totalMeals;

            const bazarSnap = await getDocs(collection(this.db, 'bazar'));
            let totalBazar = 0; bazarSnap.forEach(d => totalBazar += (d.data().amount || 0));
            document.getElementById('totalBazar').textContent = '৳' + totalBazar;

            const rate = totalMeals > 0 ? (totalBazar / totalMeals) : 0;
            document.getElementById('mealRate').textContent = '৳' + rate.toFixed(2);
            await setDoc(doc(this.db, 'settings', 'mealRate'), { rate }, { merge: true });
        }
        showSuccess(buttonId) {
            const btn = document.getElementById(buttonId);
            btn.classList.add('btn-success');
            setTimeout(() => btn.classList.remove('btn-success'), 1500);
        }
        async addMember() {
            const name = document.getElementById('newMemberName').value.trim();
            const deposit = parseFloat(document.getElementById('newMemberDeposit').value) || 0;
            if (!name) return alert('Enter member name');
            await window.FirebaseSDK.addDoc(window.FirebaseSDK.collection(this.db, 'members'), {
                name, totalDeposit: deposit, totalMeals: 0, createdAt: window.FirebaseSDK.serverTimestamp()
            });
            document.getElementById('newMemberName').value = '';
            document.getElementById('newMemberDeposit').value = '';
            this.showSuccess('btnAddMember');
            await this.loadAllData();
            alert('✅ Border registered');
        }
        async addDeposit() {
            const memberId = document.getElementById('memberSelect').value;
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!memberId || isNaN(amount) || amount <= 0) return alert('Select border and amount');
            const ref = window.FirebaseSDK.doc(this.db, 'members', memberId);
            const snap = await window.FirebaseSDK.getDoc(ref);
            if (!snap.exists()) return alert('Member not found');
            await window.FirebaseSDK.updateDoc(ref, { totalDeposit: (snap.data().totalDeposit || 0) + amount });
            document.getElementById('depositAmount').value = '';
            this.showSuccess('btnDeposit');
            await this.loadAllData();
            alert('✅ Payment recorded');
        }
        async addBazar() {
            const date = document.getElementById('bazarDate').value;
            const purchaser = document.getElementById('purchaser').value.trim();
            const amount = parseFloat(document.getElementById('bazarAmount').value);
            if (!date || !purchaser || isNaN(amount) || amount <= 0) return alert('Fill all fields');
            await window.FirebaseSDK.addDoc(window.FirebaseSDK.collection(this.db, 'bazar'), {
                date, purchaser, amount, timestamp: window.FirebaseSDK.serverTimestamp()
            });
            document.getElementById('bazarDate').value = '';
            document.getElementById('purchaser').value = '';
            document.getElementById('bazarAmount').value = '';
            this.showSuccess('btnBazar');
            await this.loadAllData();
            alert('✅ Expense logged');
        }
        async updateManagerName() {
            const newName = document.getElementById('managerNameInput').value.trim();
            if (!newName) return alert('Enter name');
            await window.FirebaseSDK.setDoc(window.FirebaseSDK.doc(this.db, 'settings', 'manager'), { name: newName }, { merge: true });
            this.showSuccess('btnManagerName');
            alert('✅ Manager name updated');
        }
        async changePassword() {
            const oldPass = document.getElementById('oldPassword').value;
            const newPass = document.getElementById('newPassword').value;
            if (!oldPass || !newPass) return alert('Enter both passwords');
            if (newPass.length < 6) return alert('Min 6 characters');
            const credential = window.FirebaseSDK.EmailAuthProvider.credential(this.currentUser.email, oldPass);
            await window.FirebaseSDK.reauthenticateWithCredential(this.currentUser, credential);
            await window.FirebaseSDK.updatePassword(this.currentUser, newPass);
            document.getElementById('oldPassword').value = '';
            document.getElementById('newPassword').value = '';
            this.showSuccess('btnPassword');
            alert('✅ Password changed');
        }
        handleLogout() {
            window.FirebaseSDK.signOut(this.auth).then(() => window.location.replace('login.html'));
        }
    }
    window.AppConsole = new EnterpriseConsole();
</script>
</body>
</html>
