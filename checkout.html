<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Checkout — NAIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { brandDark: '#0f172a' } }}}
</script>
<style>
body {
  background: radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  background-attachment: fixed; min-height: 100vh; color: #f3f8ff;
}
::-webkit-scrollbar { display: none; }
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
  -webkit-backdrop-filter: blur(14px) saturate(145%);
}
.glass-nav { background: rgba(8,22,43,.78); border-bottom: 1px solid rgba(180,225,255,.2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.input-lite {
  width: 100%; padding: 12px; border-radius: 12px;
  border: 1px solid rgba(200,230,255,.25);
  background: rgba(5,18,37,.62); color: #f4f9ff; font-weight: 700;
  font-size: 14px;
}
.input-lite:focus { outline: none; border-color: #67d9ff; box-shadow: 0 0 0 3px rgba(55,190,255,.17); }
.copy-btn { transition: transform .15s ease; }
.copy-btn:active { transform: scale(0.9); }
.upload-zone { transition: all .25s ease; }
.upload-zone:hover { border-color: #60a5fa; background: rgba(30,58,138,.15); }
</style>
</head>
<body class="antialiased pb-10">

<header id="site-header"></header>

<main id="app" class="max-w-2xl mx-auto px-4 py-6"></main>

<script type="module">
import { db, auth, onAuthStateChanged, addDoc, collection, serverTimestamp, doc, getDoc, setDoc } from './js/firebase.js';
import { cachedConfig, formatPrice, loadDraft, clearDraft, currentRegion, REGIONS, savePhone, loadPhone } from './js/store.js';
import { DEFAULT_CONFIG } from './js/products.js';
import { renderHeader, showToast, esc, copyText } from './js/ui.js';

renderHeader('checkout');

const app = document.getElementById('app');
const draft = loadDraft();

if (!draft || Date.now() - draft.savedAt > 24 * 3600 * 1000) {
  clearDraft();
  app.innerHTML = `
    <div class="glass rounded-2xl p-8 text-center">
      <i class="fas fa-hourglass-end text-4xl text-amber-400 mb-3"></i>
      <p class="text-lg font-black mb-2">Your order expired</p>
      <p class="text-sm text-slate-400 mb-4">Please start a new order.</p>
      <a href="index.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm">
        <i class="fas fa-arrow-left mr-1"></i> Back to shop
      </a>
    </div>`;
} else {
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      app.innerHTML = `
        <div class="glass rounded-2xl p-8 text-center">
          <i class="fas fa-lock text-4xl text-blue-400 mb-3"></i>
          <p class="text-lg font-black mb-2">Login required</p>
          <p class="text-sm text-slate-400 mb-4">You need an account to place an order.</p>
          <a href="login.html?next=checkout.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm">
            <i class="fas fa-sign-in-alt mr-1"></i> Login / Sign up
          </a>
        </div>`;
      return;
    }
    renderCheckout(user);
  });
}

async function renderCheckout(user) {
  let cfg = cachedConfig();
  try {
    const snap = await getDoc(doc(db, 'settings', 'config'));
    if (snap.exists()) cfg = snap.data();
  } catch {}
  if (!cfg) cfg = DEFAULT_CONFIG;

  const region = currentRegion();
  const reg = REGIONS[region];
  const paySet = cfg.payments[region] || cfg.payments.US;
  const total = draft.priceUSD * draft.quantity;
  const totalStr = formatPrice(draft.priceUSD, draft.quantity);

  app.innerHTML = `
    <a href="product.html?id=${draft.productId}" class="inline-flex items-center gap-2 text-slate-300 hover:text-white text-sm font-bold mb-4">
      <i class="fas fa-arrow-left"></i> Edit order
    </a>

    <div class="glass rounded-2xl p-5 mb-4">
      <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-xl p-4 mb-4 border border-white/10">
        <div class="flex justify-between items-start gap-3">
          <div class="flex-1 min-w-0">
            <p class="font-black text-white">${esc(draft.productTitle)}</p>
            <p class="text-xs text-slate-300 mt-1">Qty: ${draft.quantity}</p>
            ${draft.customValue ? `<p class="text-xs text-indigo-300 mt-1 break-all">${esc(draft.customLabel)}: ${esc(draft.customValue)}</p>` : ''}
          </div>
          <div class="text-right shrink-0">
            <p class="text-[10px] font-bold text-slate-400 uppercase">Total</p>
            <p class="text-2xl font-black text-yellow-400">${totalStr}</p>
          </div>
        </div>
      </div>

      <h2 class="text-xs font-black uppercase text-slate-400 mb-2"><i class="fas fa-credit-card mr-1"></i>Send payment to:</h2>
      <div class="space-y-2 mb-5">
        ${(paySet.methods || []).filter(m => m.enabled).map(m => `
          <div class="glass rounded-xl p-3">
            <div class="flex items-center gap-2 mb-2">
              <div class="w-8 h-8 rounded-lg ${m.bg} ${m.color} flex items-center justify-center">
                <i class="${m.icon}"></i>
              </div>
              <div class="flex-1">
                <p class="font-black text-sm ${m.color}">${esc(m.name)}</p>
                <p class="text-[10px] text-slate-400 font-bold uppercase">${esc(m.type)}</p>
              </div>
            </div>
            ${m.bank ? `<p class="text-[10px] text-slate-400 uppercase font-bold mb-0.5">Bank</p><p class="text-sm font-black mb-1">${esc(m.bank)}</p>` : ''}
            ${m.holder ? `<p class="text-[10px] text-slate-400 uppercase font-bold mb-0.5">Holder</p><p class="text-sm font-black mb-1">${esc(m.holder)}</p>` : ''}
            ${m.network ? `<p class="text-[10px] text-slate-400 uppercase font-bold mb-0.5">Network</p><p class="text-sm font-black mb-1">${esc(m.network)}</p>` : ''}
            <p class="text-[10px] text-slate-400 uppercase font-bold mb-0.5">Account</p>
            <div class="flex items-center gap-2">
              <p class="font-mono text-xs break-all flex-1">${esc(m.account)}</p>
              <button data-copy="${esc(m.account)}" data-label="${esc(m.name)}" class="copy-btn px-2 py-1 bg-blue-600 text-white text-[10px] font-bold rounded">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          </div>
        `).join('')}
      </div>

      <h2 class="text-xs font-black uppercase text-slate-400 mb-2"><i class="fas fa-camera mr-1"></i>Upload payment screenshot *</h2>
      <div class="glass border-2 border-dashed border-white/30 rounded-xl p-4 text-center mb-3 upload-zone" id="upload-zone">
        <input type="file" id="screenshot" accept="image/*" class="hidden">
        <label for="screenshot" class="cursor-pointer block">
          <i class="fas fa-cloud-upload-alt text-3xl text-slate-400 mb-2"></i>
          <p id="upload-text" class="font-bold text-sm text-white">Click to upload screenshot</p>
          <p class="text-[10px] text-slate-400 mt-1">PNG, JPG · auto scan</p>
        </label>
        <img id="preview" class="hidden mx-auto mt-3 max-h-40 rounded-lg shadow-lg">
        <div id="scan-result" class="hidden mt-3"></div>
      </div>

      <label class="text-xs font-bold text-slate-300 block mb-1">Your phone (optional)</label>
      <input type="tel" id="phone" class="input-lite mb-3" placeholder="01XXXXXXXXX" value="${esc(loadPhone())}">

      <div class="bg-amber-500/10 border border-amber-400/30 rounded-xl p-3 mb-4">
        <p class="text-[11px] text-amber-200 font-semibold leading-relaxed">
          <i class="fas fa-info-circle mr-1"></i>
          Your screenshot + extracted data will be sent to admin for verification.
        </p>
      </div>

      <button id="submit-btn" disabled class="w-full py-4 text-base font-black text-white bg-blue-600 rounded-2xl shadow-lg shadow-blue-600/30 opacity-40 flex items-center justify-center gap-2">
        <i class="fas fa-paper-plane"></i> Submit Order
      </button>
    </div>
  `;

  app.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => copyText(b.dataset.copy, b.dataset.label);
  });

  let selectedFile = null;
  let extractedData = null;

  document.getElementById('screenshot').onchange = async (e) => {
    selectedFile = e.target.files[0];
    if (!selectedFile) return;
    document.getElementById('preview').src = URL.createObjectURL(selectedFile);
    document.getElementById('preview').classList.remove('hidden');
    document.getElementById('upload-text').innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Scanning...';

    try {
      const { scanScreenshot } = await import('./js/ocr.js');
      extractedData = await scanScreenshot(selectedFile, { amountNumeric: total });
      renderScan(extractedData);
      document.getElementById('upload-text').innerHTML = '<i class="fas fa-check-circle text-green-400 mr-1"></i>Scanned · confirm TrxID';
      enableSubmit();
    } catch (err) {
      console.error(err);
      document.getElementById('upload-text').innerHTML = '<i class="fas fa-exclamation-triangle text-amber-400 mr-1"></i>Scan failed — enter TrxID manually';
      extractedData = { trxId: null, amount: null, fullText: '' };
      renderScan(extractedData);
      enableSubmit();
    }
  };

  function renderScan(info) {
    document.getElementById('scan-result').innerHTML = `
      <div class="glass rounded-xl p-3 text-left">
        ${info.amount ? `<p class="text-[11px] font-bold ${info.matchesAmount ? 'text-green-400' : 'text-red-400'} mb-1">
          <i class="fas fa-money-bill mr-1"></i>Paid: ${esc(info.amount)}${info.matchesAmount ? ' ✓' : ' (expected ' + esc(totalStr) + ')'}
        </p>` : ''}
        <label class="text-[10px] font-bold text-slate-300 block mb-1">Transaction ID *</label>
        <input id="scan-trx" class="input-lite text-xs" style="text-transform:uppercase"
          value="${esc(info.trxId || '')}" placeholder="Enter TrxID">
      </div>
    `;
    document.getElementById('scan-result').classList.remove('hidden');
    document.getElementById('scan-trx').oninput = (e) => {
      extractedData.trxId = e.target.value.trim().toUpperCase() || null;
    };
  }

  function enableSubmit() {
    const btn = document.getElementById('submit-btn');
    btn.disabled = false;
    btn.classList.remove('opacity-40');
  }

  document.getElementById('submit-btn').onclick = async () => {
    const phone = document.getElementById('phone').value.trim();
    savePhone(phone);

    if (!selectedFile) return showToast('Upload screenshot first', 'bg-red-600');
    if (!extractedData || !extractedData.trxId || extractedData.trxId.length < 6) {
      return showToast('Enter Transaction ID', 'bg-red-600');
    }

    const expected = parseFloat(total);
    const paid = parseFloat(String(extractedData.amount || '').replace(/,/g, ''));
    if (!isNaN(paid) && !isNaN(expected) && paid < expected) {
      return showToast('Paid amount is less than expected!', 'bg-red-600');
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Saving...';

    try {
      const trxSnap = await getDoc(doc(db, 'used_trx', extractedData.trxId));
      if (trxSnap.exists()) throw new Error('This TrxID was already used');

      const proofImg = await shrinkImage(selectedFile);
      const orderId = 'ORD-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();

      await addDoc(collection(db, 'orders'), {
        orderId,
        productId: draft.productId,
        productTitle: draft.productTitle,
        quantity: draft.quantity,
        amount: totalStr,
        amountNumeric: total,
        currency: reg.currency,
        region,
        customValue: draft.customValue,
        customLabel: draft.customLabel,
        userId: user.uid,
        userName: user.displayName || '',
        userEmail: user.email,
        userPhone: phone || null,
        extracted: extractedData,
        proofImg,
        status: 'pending',
        createdAt: serverTimestamp(),
        createdMs: Date.now()
      });

      await setDoc(doc(db, 'used_trx', extractedData.trxId), { orderId, uid: user.uid });
      clearDraft();
      location.href = 'success.html?id=' + encodeURIComponent(orderId);
    } catch (err) {
      showToast(err.message, 'bg-red-600');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Submit Order';
    }
  };
}

async function shrinkImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      let data = canvas.toDataURL('image/jpeg', 0.6);
      if (data.length > 700000) data = canvas.toDataURL('image/jpeg', 0.35);
      resolve(data);
    };
    img.src = URL.createObjectURL(file);
  });
}
</script>
</body>
</html>
