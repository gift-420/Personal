<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Region — NAIM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } }}}
</script>
<style>
body {
  background: radial-gradient(ellipse at 8% 0%, rgba(22,119,255,.35), transparent 34%),
    radial-gradient(ellipse at 92% 18%, rgba(55,224,255,.19), transparent 30%),
    radial-gradient(ellipse at 80% 90%, rgba(133,89,255,.2), transparent 34%),
    linear-gradient(145deg, #040a16 0%, #0a1a33 46%, #06101f 100%);
  min-height: 100vh; color: #f3f8ff;
}
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(113,177,255,.075) 42%, rgba(255,255,255,.055));
  border: 1px solid rgba(224,243,255,.27);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.17);
  backdrop-filter: blur(14px) saturate(145%);
}
</style>
</head>
<body class="antialiased flex items-center justify-center p-4">

<div class="glass rounded-3xl p-6 max-w-sm w-full">
  <div class="text-center mb-6">
    <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
      <i class="fas fa-globe text-2xl text-white"></i>
    </div>
    <h1 class="text-2xl font-black text-white">Select Region</h1>
    <p class="text-xs text-slate-400 mt-1">Currency & payment will change</p>
  </div>

  <div class="space-y-2">
    <button onclick="pick('BD')" class="w-full glass rounded-2xl p-4 flex items-center justify-between hover:bg-white/10 transition">
      <div class="text-left">
        <p class="font-black text-white">Bangladesh</p>
        <p class="text-xs text-slate-400">BDT ৳ · bKash, Nagad</p>
      </div>
      <span class="text-3xl">🇧🇩</span>
    </button>
    <button onclick="pick('NG')" class="w-full glass rounded-2xl p-4 flex items-center justify-between hover:bg-white/10 transition">
      <div class="text-left">
        <p class="font-black text-white">Nigeria</p>
        <p class="text-xs text-slate-400">NGN ₦ · OPay</p>
      </div>
      <span class="text-3xl">🇳🇬</span>
    </button>
    <button onclick="pick('US')" class="w-full glass rounded-2xl p-4 flex items-center justify-between hover:bg-white/10 transition">
      <div class="text-left">
        <p class="font-black text-white">Global</p>
        <p class="text-xs text-slate-400">USD $ · USDT</p>
      </div>
      <span class="text-3xl">🌍</span>
    </button>
  </div>

  <a href="index.html" class="block text-center mt-4 text-xs text-slate-400 hover:text-white">
    ← Back
  </a>
</div>

<script type="module">
import { saveRegion } from './js/store.js';
import { showToast } from './js/ui.js';

window.pick = (code) => {
  saveRegion(code);
  showToast('Region set to ' + code, 'bg-green-600');
  setTimeout(() => location.href = 'index.html', 300);
};
</script>
</body>
</html>
