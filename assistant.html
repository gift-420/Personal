<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070711">

<title>Assistant Panel — Ma Achiya Villa</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<style>

:root{
    --bg:#05050b;
    --glass:rgba(20,20,38,.55);
    --glass2:rgba(255,255,255,.045);
    --border:rgba(255,255,255,.09);

    --purple:#a78bfa;
    --blue:#60a5fa;
    --green:#34d399;
    --red:#f87171;

    --text:#fff;
    --muted:rgba(255,255,255,.55);

    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
    -webkit-tap-highlight-color:transparent;
}

body{

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(124,58,237,.35),
            transparent 45%
        ),
        radial-gradient(
            circle at 100% 40%,
            rgba(37,99,235,.16),
            transparent 35%
        ),
        #05050b;

    color:var(--text);

    font-family:Inter,
        "Noto Sans Bengali",
        sans-serif;

    padding:14px;

    overflow-x:hidden;
}

/* ---------- glass ---------- */

.glass{

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.018)
        );

    border:1px solid var(--border);

    backdrop-filter:
        blur(28px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(160%);

    box-shadow:
        0 20px 60px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);

    border-radius:var(--radius);
}

/* ---------- header ---------- */

.logo{

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:2px solid var(--green);

    box-shadow:
        0 0 28px rgba(52,211,153,.35),
        inset 0 1px 0 rgba(255,255,255,.2);

    background:rgba(255,255,255,.04);

    flex-shrink:0;
}

.logo-bn{

    font-family:
        "Noto Sans Bengali",
        sans-serif;

    font-size:10px;
    font-weight:900;
    text-align:center;
}

.logo-en{

    display:block;

    font-size:7px;
    letter-spacing:1.4px;

    color:var(--muted);

    text-align:center;
}

.menu{

    width:46px;
    height:46px;

    border-radius:15px;

    border:1px solid var(--border);

    background:var(--glass2);

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:5px;

    cursor:pointer;
}

.menu span{

    width:18px;
    height:2px;

    background:#fff;

    border-radius:10px;
}

/* ---------- role badge ---------- */

.role{

    padding:8px 14px;

    border-radius:999px;

    background:rgba(52,211,153,.08);

    border:1px solid rgba(52,211,153,.2);

    text-align:center;
}

.role-title{

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;

    color:var(--muted);
}

.role-name{

    font-size:12px;

    font-weight:800;

    color:var(--green);
}

/* ---------- cards ---------- */

.card{

    padding:18px;

    margin-bottom:14px;
}

.card-title{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:800;

    margin-bottom:14px;
}

/* ---------- stats ---------- */

.stat{

    padding:15px 8px;

    text-align:center;
}

.stat-icon{

    font-size:22px;

    margin-bottom:5px;
}

.stat-label{

    font-size:9px;

    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:1px;
}

.stat-value{

    margin-top:3px;

    font-size:21px;

    font-weight:900;
}

/* ---------- buttons ---------- */

.btn{

    border:1px solid var(--border);

    background:rgba(255,255,255,.045);

    color:white;

    border-radius:15px;

    padding:11px 15px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;

    font-size:13px;
}

.btn:hover{

    background:rgba(255,255,255,.09);

    transform:translateY(-1px);
}

.btn-green{

    background:rgba(52,211,153,.12);

    border-color:rgba(52,211,153,.25);

    color:#6ee7b7;
}

.btn-red{

    background:rgba(248,113,113,.1);

    border-color:rgba(248,113,113,.2);

    color:#fca5a5;
}

/* ---------- search ---------- */

.search{

    width:100%;

    padding:13px 15px;

    border-radius:16px;

    outline:none;

    border:1px solid var(--border);

    background:rgba(0,0,0,.2);

    color:#fff;

    font-size:13px;

    margin-bottom:12px;
}

.search:focus{

    border-color:rgba(167,139,250,.45);

    box-shadow:
        0 0 0 3px rgba(167,139,250,.08);
}

/* ---------- member ---------- */

.member{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:14px;

    border-radius:18px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.06);

    margin-bottom:8px;

    transition:.2s;
}

.member:hover{

    background:rgba(255,255,255,.065);

    border-color:rgba(255,255,255,.11);
}

.member-name{

    font-family:
        "Noto Sans Bengali",
        sans-serif;

    font-weight:800;

    font-size:14px;
}

.member-info{

    font-size:11px;

    color:var(--muted);

    margin-top:3px;
}

.balance{

    font-size:17px;

    font-weight:900;

    white-space:nowrap;
}

/* ---------- dropdown ---------- */

.dropdown{

    position:absolute;

    right:0;

    top:56px;

    min-width:210px;

    padding:7px;

    border-radius:20px;

    background:rgba(18,18,34,.92);

    border:1px solid var(--border);

    backdrop-filter:blur(30px);

    box-shadow:0 25px 70px rgba(0,0,0,.55);

    z-index:100;
}

.dropdown button{

    width:100%;

    border:0;

    background:transparent;

    color:#fff;

    padding:12px 14px;

    border-radius:14px;

    text-align:left;

    cursor:pointer;
}

.dropdown button:hover{

    background:rgba(255,255,255,.06);
}

.hidden{
    display:none!important;
}

/* ---------- loading ---------- */

.loader{

    width:32px;
    height:32px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.08);

    border-top-color:var(--purple);

    animation:spin .7s linear infinite;

    margin:20px auto;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* ---------- mobile ---------- */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .glass{
        border-radius:21px;
    }

    .card{
        padding:15px;
    }

    .logo{
        width:50px;
        height:50px;
    }

    .role{
        padding:7px 10px;
    }

    .role-name{
        font-size:10px;
    }

    .stat-value{
        font-size:18px;
    }

}

</style>

</head>

<body>

<div class="max-w-2xl mx-auto">

<!-- HEADER -->

<header class="flex items-center justify-between gap-3 mb-5">

    <div class="logo">

        <div>

            <div class="logo-bn">
                মা আছিয়া
            </div>

            <span class="logo-en">
                VILLA
            </span>

        </div>

    </div>


    <div class="role">

        <div class="role-title">
            Assistant
        </div>

        <div class="role-name"
             id="assistantName">
            Loading...
        </div>

    </div>


    <div class="relative">

        <button class="menu"
                onclick="toggleMenu()">

            <span></span>
            <span></span>
            <span></span>

        </button>

        <div id="dropdown"
             class="dropdown hidden">

            <button onclick="location.href='index.html'">
                🏠 Dashboard
            </button>

            <button onclick="logout()"
                    style="color:#fca5a5">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<!-- STATS -->

<div class="grid grid-cols-3 gap-2 mb-4">

    <div class="glass stat">

        <div class="stat-icon">
            💰
        </div>

        <div class="stat-label">
            Meal Rate
        </div>

        <div class="stat-value"
             id="mealRate"
             style="color:var(--purple)">
            —
        </div>

    </div>


    <div class="glass stat">

        <div class="stat-icon">
            👥
        </div>

        <div class="stat-label">
            Members
        </div>

        <div class="stat-value"
             id="memberCount"
             style="color:var(--blue)">
            —
        </div>

    </div>


    <div class="glass stat">

        <div class="stat-icon">
            🍽️
        </div>

        <div class="stat-label">
            Meals
        </div>

        <div class="stat-value"
             id="totalMeals"
             style="color:var(--green)">
            —
        </div>

    </div>

</div>


<!-- MEMBERS -->

<section class="glass card">

    <div class="card-title">

        <span>👥</span>

        Members

    </div>


    <input
        id="memberSearch"
        class="search"
        type="search"
        placeholder="Search member..."
        autocomplete="off"
    >


    <div id="membersList">

        <div class="loader"></div>

    </div>

</section>


<!-- QUICK ACTION -->

<section class="glass card">

    <div class="card-title">
        ⚡ Quick Access
    </div>

    <div class="grid grid-cols-2 gap-2">

        <button class="btn btn-green"
                onclick="location.href='index.html'">
            📊 Dashboard
        </button>

        <button class="btn"
                onclick="location.reload()">
            🔄 Refresh
        </button>

    </div>

</section>

</div>


<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDAr77xGTIvPzZOfmSzFwYt7GHLncCYQ2A",

    authDomain:
    "my-mess-17fbc.firebaseapp.com",

    projectId:
    "my-mess-17fbc",

    storageBucket:
    "my-mess-17fbc.firebasestorage.app",

    messagingSenderId:
    "848426874799",

    appId:
    "1:848426874799:web:0722af59e7504da847e15a",

    measurementId:
    "G-RWHJKGV5LS"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let currentUser = null;

let members = [];

let sessionVersion = null;


/* ==============================
   AUTH
============================== */

onAuthStateChanged(auth, async user => {

    if(!user){

        location.replace("login.html");

        return;
    }

    currentUser = user;

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );

        if(!snap.exists()){

            await signOut(auth);

            location.replace("login.html");

            return;
        }

        const data =
            snap.data();


        if(
            data.active === false ||
            data.role !== "assistant"
        ){

            await signOut(auth);

            alert(
                "Assistant access is disabled."
            );

            location.replace("login.html");

            return;
        }


        sessionVersion =
            Number(
                data.sessionVersion || 1
            );


        document.getElementById(
            "assistantName"
        ).textContent =
            data.name ||
            user.email ||
            "Assistant";


        await loadDashboard();


    }catch(error){

        console.error(error);

        await signOut(auth);

        location.replace("login.html");

    }

});


/* ==============================
   SESSION VERSION
============================== */

async function checkSession(){

    if(!currentUser)
        return false;


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!snap.exists())
            return false;


        const data =
            snap.data();


        if(
            data.active === false ||
            Number(data.sessionVersion || 1)
            !== sessionVersion
        ){

            await signOut(auth);

            alert(
                "Your session has expired. Please login again."
            );

            location.replace("login.html");

            return false;
        }


        return true;

    }catch(e){

        console.error(e);

        return true;
    }

}


/* ==============================
   LOAD
============================== */

async function loadDashboard(){

    const rateSnap =
        await getDoc(
            doc(
                db,
                "settings",
                "mealRate"
            )
        );


    const rate =
        rateSnap.exists()
        ? Number(
            rateSnap.data().rate || 0
        )
        : 0;


    document.getElementById(
        "mealRate"
    ).textContent =
        "৳" + rate.toFixed(2);


    const snap =
        await getDocs(
            collection(
                db,
                "members"
            )
        );


    members = [];

    let totalMeals = 0;


    snap.forEach(item => {

        const data =
            item.data();


        const member = {

            id:item.id,

            ...data

        };


        members.push(member);


        totalMeals +=
            Number(
                data.totalMeals || 0
            );

    });


    document.getElementById(
        "memberCount"
    ).textContent =
        members.length;


    document.getElementById(
        "totalMeals"
    ).textContent =
        totalMeals;


    renderMembers(rate);

}


/* ==============================
   MEMBERS
============================== */

function renderMembers(rate){

    const search =
        document.getElementById(
            "memberSearch"
        ).value
        .trim()
        .toLowerCase();


    const list =
        document.getElementById(
            "membersList"
        );


    const filtered =
        members.filter(member => {

            const name =
                String(
                    member.name || ""
                ).toLowerCase();

            return name.includes(search);

        });


    if(!filtered.length){

        list.innerHTML = `

            <div class="text-center py-7 text-sm"
                 style="color:var(--muted)">

                No members found

            </div>

        `;

        return;
    }


    list.innerHTML =
        filtered.map(member => {

            const deposit =
                Number(
                    member.totalDeposit || 0
                );


            const meals =
                Number(
                    member.totalMeals || 0
                );


            const balance =
                deposit -
                meals * rate;


            const positive =
                balance >= 0;


            return `

                <div class="member">

                    <div style="min-width:0">

                        <div class="member-name">
                            ${escapeHTML(
                                member.name ||
                                "Unnamed"
                            )}
                        </div>

                        <div class="member-info">

                            Deposit:
                            ৳${deposit.toFixed(0)}

                            &nbsp;•&nbsp;

                            Meals:
                            ${meals}

                        </div>

                    </div>


                    <div
                        class="balance"
                        style="
                            color:
                            ${positive
                                ? 'var(--green)'
                                : 'var(--red)'};
                        "
                    >

                        ${positive
                            ? '+'
                            : '-'}
                        ৳${Math.abs(balance).toFixed(0)}

                    </div>

                </div>

            `;

        }).join("");

}


/* ==============================
   SEARCH
============================== */

document
.getElementById("memberSearch")
.addEventListener(
    "input",
    async () => {

        const ok =
            await checkSession();

        if(ok){

            const rate =
                Number(
                    document
                    .getElementById(
                        "mealRate"
                    )
                    .textContent
                    .replace("৳","")
                ) || 0;

            renderMembers(rate);
        }

    }
);


/* ==============================
   LOGOUT
============================== */

window.logout =
async function(){

    await signOut(auth);

    location.replace(
        "login.html"
    );

};


/* ==============================
   ESCAPE
============================== */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}


/* ==============================
   AUTO SESSION CHECK
============================== */

setInterval(
    checkSession,
    15000
);

</script>


<script>

function toggleMenu(){

    document
        .getElementById("dropdown")
        .classList
        .toggle("hidden");

}

document.addEventListener(
    "click",
    function(e){

        if(
            !e.target.closest(".menu") &&
            !e.target.closest(".dropdown")
        ){

            document
                .getElementById("dropdown")
                .classList
                .add("hidden");

        }

    }
);

</script>

</body>
</html>
