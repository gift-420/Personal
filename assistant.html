<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDAr77xGTIvPzZOfmSzFwYt7GHLncCYQ2A",
    authDomain: "my-mess-17fbc.firebaseapp.com",
    projectId: "my-mess-17fbc",
    storageBucket: "my-mess-17fbc.firebasestorage.app",
    messagingSenderId: "848426874799",
    appId: "1:848426874799:web:0722af59e7504da847e15a",
    measurementId: "G-RWHJKGV5LS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;
window.auth = auth;

window.FirebaseFunctions = {
    collection,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    getDocs,
    onAuthStateChanged,
    signOut,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
};

window.firebaseReady = true;

console.log("Firebase initialized successfully");

if (typeof window.startAssistantApp === "function") {
    window.startAssistantApp();
}

</script>

<style>

:root {
    --bg:#05050c;
    --glass:rgba(16,16,34,.48);
    --border:rgba(255,255,255,.08);
    --text:#fff;
    --muted:rgba(255,255,255,.55);
    --purple:#a78bfa;
    --blue:#60a5fa;
    --green:#34d399;
    --red:#f87171;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    padding:18px;
    min-height:100vh;
    color:var(--text);
    font-family:Inter,'Noto Sans Bengali',sans-serif;
    background:
        radial-gradient(
            ellipse 90% 70% at 50% -30%,
            #1c1148 0%,
            #0d0d20 42%,
            #05050c 72%
        );
}

body:after {
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 60%,#8b5cf6,transparent 35%),
        radial-gradient(circle at 80% 20%,#3b82f6,transparent 35%);
    opacity:.12;
    filter:blur(80px);
}

.glass {
    position:relative;
    z-index:2;
    background:var(--glass);
    backdrop-filter:blur(35px) saturate(180%);
    -webkit-backdrop-filter:blur(35px) saturate(180%);
    border:1px solid var(--border);
    border-radius:25px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.07);
}

.input {
    width:100%;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    padding:11px 13px;
    color:#fff;
    outline:none;
}

.input:focus {
    border-color:var(--purple);
    box-shadow:0 0 0 4px rgba(167,139,250,.1);
}

.btn {
    border:0;
    border-radius:14px;
    padding:11px 16px;
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn:hover {
    transform:translateY(-1px);
}

.btn-purple {
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);
}

.btn-green {
    background:linear-gradient(135deg,#34d399,#059669);
}

.btn-blue {
    background:linear-gradient(135deg,#60a5fa,#2563eb);
}

.btn-red {
    background:linear-gradient(135deg,#f87171,#dc2626);
}

.meal-table {
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

.meal-table th {
    padding:12px 8px;
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    border-bottom:1px solid var(--border);
}

.meal-table td {
    padding:11px 8px;
    border-bottom:1px solid rgba(255,255,255,.04);
    text-align:center;
}

.meal-table td:first-child {
    text-align:left;
    font-weight:700;
}

.meal-check {
    width:21px;
    height:21px;
    accent-color:#8b5cf6;
    cursor:pointer;
}

.guest-input {
    width:70px;
    text-align:center;
}

.total {
    color:#c4b5fd;
    font-weight:800;
}

.guest-total {
    color:#34d399;
    font-weight:700;
}

.daily-total {
    color:#60a5fa;
    font-weight:900;
    font-size:16px;
}

.modal {
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box {
    width:100%;
    max-width:480px;
    padding:22px;
}

.hidden {
    display:none!important;
}

.stat {
    padding:15px;
    text-align:center;
}

.stat-value {
    font-size:24px;
    font-weight:900;
}

.stat-label {
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
}

@media(max-width:700px) {
    body {
        padding:10px;
    }

    .meal-table {
        min-width:850px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="glass p-4 mb-4 flex flex-wrap items-center justify-between gap-3">

    <div>
        <div class="text-xl font-black">

        <div class="text-xs text-gray-400">

        <div id="userEmail"
             class="text-xs text-purple-300 mt-1">

    <div class="flex gap-2">

        <a href="index.html"

<!-- CONTROLS -->

<!-- MEAL SHEET -->

<div class="glass p-4 mb-4">

        <div>
            <h2 class="text-lg font-bold">

            <p class="text-xs text-gray-400">
                Guest সংখ্যা দিলে শুধু সেই guest meal total-এ যোগ হবে

                    <th>Dinner<br>(1)</th>

            </thead>

            <tbody id="mealTableBody">

                <tr>
                    <td colspan="8"

</div>


<!-- PASSWORD -->

<div class="glass p-4 mb-4">

    <h2 class="font-bold mb-3">
        🔐 Change Assistant Password
    </h2>

    <div class="grid md:grid-cols-2 gap-3">

        <input
            id="oldPasswordAssist"

        <input

    <button

    <div id="assistPasswordError"

<script>

let members = [];
let currentMealsData = {};
let selectedDateStr = new Date()
    .toISOString()
    .split("T")[0];

document.getElementById("selectedDate").value =
    selectedDateStr;

document.getElementById("statDate").textContent =
    selectedDateStr;


/* =========================
   AUTH
========================= */

function setupAuth() {

    if (!window.auth) {
        console.error("Firebase Auth not ready.");
        return;
    }

    const {
        onAuthStateChanged
    } = window.FirebaseFunctions;

    onAuthStateChanged(
        window.auth,
        async user => {

            console.log(
                "Auth:",
                user ? user.email : "none"
            );

            if (
                !user ||
                user.email.toLowerCase() !==
                "spi1@gmail.com"
            ) {

                window.location.href =
                    "login.html";

                return;
            }

            localStorage.setItem(
                "assistLoggedIn",
                "true"
            );

            document.getElementById(
                "userEmail"
            ).textContent = user.email;

            await loadMembersAndMeals();

        }
    );
}


/* =========================
   LOAD MEMBERS
========================= */

async function loadMembersAndMeals() {

    try {

        const {
            collection,
            getDocs
        } = window.FirebaseFunctions;

        const snap =
            await getDocs(
                collection(
                    window.db,
                    "members"
                )
            );

        members = [];

        snap.forEach(d => {

            const data = d.data();

            /*
             * active false হলে member history-তে
             * থাকতে পারে কিন্তু current assistant
             * sheet-এ দেখানো হবে না.
             */
            if (data.active !== false) {

                members.push({
                    id: d.id,
                    ...data
                });

            }

        });

        document.getElementById(
            "statMembers"
        ).textContent = members.length;

        await loadTodaysMealsData();

        renderTable();

    } catch(error) {

        console.error(error);

        document.getElementById(
            "mealTableBody"
        ).innerHTML = `
            <tr>
                <td colspan="8"
                    class="text-center py-10 text-red-400">
                    ❌ ${escapeHTML(error.message)}
                </td>
            </tr>
        `;

    }
}


/* =========================
   LOAD DAY
========================= */

async function loadTodaysMealsData() {

    const {
        doc,
        getDoc
    } = window.FirebaseFunctions;

    const snap =
        await getDoc(
            doc(
                window.db,
                "meals",
                selectedDateStr
            )
        );

    if (snap.exists()) {

        const data = snap.data();

        currentMealsData =
            data.members || {};

    } else {

        currentMealsData = {};

    }

}


/* =========================
   RENDER
========================= */

function renderTable() {

    const tbody =
        document.getElementById(
            "mealTableBody"
        );

    tbody.innerHTML = "";

    let mainTotal = 0;
    let guestTotal = 0;

    if (!members.length) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8"
                    class="text-center py-10">
                    No members found.
                </td>
            </tr>
        `;

        return;
    }


    members.forEach(member => {

        const m =
            currentMealsData[member.id] || {};

        const breakfast =
            m.breakfast ? 1 : 0;

        const lunch =
            m.lunch ? 1 : 0;

        const dinner =
            m.dinner ? 1 : 0;

        const guest =
            Number(m.guest || 0);

        const mainMeal =
            (breakfast ? .5 : 0) +
            (lunch ? 1 : 0) +
            (dinner ? 1 : 0);

        /*
         * Guest সংখ্যাকে 1 meal হিসেবে ধরা হচ্ছে।
         * অর্থাৎ Guest = 2 হলে +2 meals.
         */
        const guestMeal = guest;

        const total =
            mainMeal + guestMeal;

        mainTotal += mainMeal;
        guestTotal += guestMeal;


        tbody.innerHTML += `

        <tr>

            <td>
                ${escapeHTML(
                    member.name || "Unnamed"
                )}
            </td>


            <td>
                <input
                    type="checkbox"
                    class="meal-check"
                    ${breakfast ? "checked" : ""}
                    onchange="
                        updateMeal(
                            '${member.id}',
                            'breakfast',
                            this.checked
                        )
                    ">
            </td>


            <td>
                <input
                    type="checkbox"
                    class="meal-check"
                    ${lunch ? "checked" : ""}
                    onchange="
                        updateMeal(
                            '${member.id}',
                            'lunch',
                            this.checked
                        )
                    ">
            </td>


            <td>
                <input
                    type="checkbox"
                    class="meal-check"
                    ${dinner ? "checked" : ""}
                    onchange="
                        updateMeal(
                            '${member.id}',
                            'dinner',
                            this.checked
                        )
                    ">
            </td>


            <td>

                <input
                    id="guest_${member.id}"
                    type="number"
                    min="0"
                    step="1"
                    value="${guest || ""}"
                    placeholder="0"
                    class="input guest-input"
                    onchange="
                        updateGuest(
                            '${member.id}',
                            this.value
                        )
                    ">

            </td>


            <td
                id="guestTotal_${member.id}"
                class="guest-total">
                ${guestMeal}
            </td>


            <td
                id="mainTotal_${member.id}"
                class="total">
                ${mainMeal}
            </td>


            <td
                id="total_${member.id}"
                class="daily-total">
                ${total}
            </td>

        </tr>
        `;

    });


    document.getElementById(
        "statMain"
    ).textContent =
        formatMeal(mainTotal);

    document.getElementById(
        "statGuest"
    ).textContent =
        formatMeal(guestTotal);

}


/* =========================
   UPDATE MAIN MEAL
========================= */

window.updateMeal =
function(memberId,type,checked) {

    if (!currentMealsData[memberId]) {

        currentMealsData[memberId] = {
            breakfast:0,
            lunch:0,
            dinner:0,
            guest:0
        };

    }

    currentMealsData[memberId][type] =
        checked ? 1 : 0;

    refreshMemberTotal(memberId);
};


/* =========================
   UPDATE GUEST
========================= */

window.updateGuest =
function(memberId,value) {

    if (!currentMealsData[memberId]) {

        currentMealsData[memberId] = {
            breakfast:0,
            lunch:0,
            dinner:0,
            guest:0
        };

    }

    let number =
        Number(value);

    if (
        !Number.isFinite(number) ||
        number < 0
    ) {
        number = 0;
    }

    number =
        Math.floor(number);

    currentMealsData[memberId].guest =
        number;

    refreshMemberTotal(memberId);
};


/* =========================
   REFRESH TOTAL
========================= */

function refreshMemberTotal(memberId) {

    const m =
        currentMealsData[memberId] || {};

    const mainMeal =
        (m.breakfast ? .5 : 0) +
        (m.lunch ? 1 : 0) +
        (m.dinner ? 1 : 0);

    const guestMeal =
        Number(m.guest || 0);

    const total =
        mainMeal + guestMeal;


    const mainEl =
        document.getElementById(
            `mainTotal_${memberId}`
        );

    const guestEl =
        document.getElementById(
            `guestTotal_${memberId}`
        );

    const totalEl =
        document.getElementById(
            `total_${memberId}`
        );


    if (mainEl)
        mainEl.textContent =
            formatMeal(mainMeal);

    if (guestEl)
        guestEl.textContent =
            formatMeal(guestMeal);

    if (totalEl)
        totalEl.textContent =
            formatMeal(total);


    calculateStats();
}


/* =========================
   STATS
========================= */

function calculateStats() {

    let main = 0;
    let guest = 0;

    Object.values(
        currentMealsData
    ).forEach(m => {

        main +=
            (m.breakfast ? .5 : 0) +
            (m.lunch ? 1 : 0) +
            (m.dinner ? 1 : 0);

        guest +=
            Number(m.guest || 0);

    });

    document.getElementById(
        "statMain"
    ).textContent =
        formatMeal(main);

    document.getElementById(
        "statGuest"
    ).textContent =
        formatMeal(guest);
}


/* =========================
   SAVE
========================= */

window.saveMeals =
async function() {

    try {

        const {
            doc,
            setDoc
        } = window.FirebaseFunctions;

        let total = 0;

        Object.values(
            currentMealsData
        ).forEach(m => {

            total +=
                (m.breakfast ? .5 : 0) +
                (m.lunch ? 1 : 0) +
                (m.dinner ? 1 : 0) +
                Number(m.guest || 0);

        });


        await setDoc(
            doc(
                window.db,
                "meals",
                selectedDateStr
            ),
            {
                date: selectedDateStr,
                members: currentMealsData,
                totalMeals: total,
                updatedAt: new Date().toISOString()
            },
            {
                merge:true
            }
        );


        /*
         * Update member totalMeals
         * from all available meal documents.
         */
        const {
            collection,
            getDocs,
            updateDoc
        } = window.FirebaseFunctions;


        const allSnap =
            await getDocs(
                collection(
                    window.db,
                    "meals"
                )
            );


        const totals = {};

        members.forEach(m => {
            totals[m.id] = 0;
        });


        allSnap.forEach(d => {

            const data = d.data();

            if (!data.members)
                return;

            Object.entries(
                data.members
            ).forEach(
                ([id,m]) => {

                    if (
                        totals[id] !== undefined
                    ) {

                        totals[id] +=
                            (m.breakfast ? .5 : 0) +
                            (m.lunch ? 1 : 0) +
                            (m.dinner ? 1 : 0) +
                            Number(m.guest || 0);

                    }

                }
            );

        });


        for (const member of members) {

            await updateDoc(
                doc(
                    window.db,
                    "members",
                    member.id
                ),
                {
                    totalMeals:
                        totals[member.id] || 0
                }
            );

        }


        document.getElementById(
            "saveStatus"
        ).textContent =
            "✓ Saved successfully";

        setTimeout(() => {

            document.getElementById(
                "saveStatus"
            ).textContent = "";

        },3000);


    } catch(error) {

        console.error(error);

        alert(
            "❌ Save failed:\n" +
            error.message
        );

    }

};


/* =========================
   COPY YESTERDAY
========================= */

window.copyYesterdayMeals =
async function() {

    try {

        const d =
            new Date(
                selectedDateStr
            );

        d.setDate(
            d.getDate() - 1
        );

        const yesterday =
            d.toISOString()
            .split("T")[0];


        const {
            doc,
            getDoc
        } = window.FirebaseFunctions;


        const snap =
            await getDoc(
                doc(
                    window.db,
                    "meals",
                    yesterday
                )
            );


        if (!snap.exists()) {

            alert(
                "⚠️ Yesterday has no meal record."
            );

            return;
        }


        const data =
            snap.data();

        currentMealsData =
            JSON.parse(
                JSON.stringify(
                    data.members || {}
                )
            );


        renderTable();

        alert(
            "📋 Yesterday copied. Click Save Meals."
        );


    } catch(error) {

        console.error(error);

        alert(
            "❌ " +
            error.message
        );

    }

};


/* =========================
   DATE
========================= */

window.changeDate =
async function() {

    selectedDateStr =
        document.getElementById(
            "selectedDate"
        ).value;

    document.getElementById(
        "statDate"
    ).textContent =
        selectedDateStr;

    await loadTodaysMealsData();

    renderTable();

};


/* =========================
   PDF
========================= */

window.downloadPDF =
function() {

    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(
            "PDF library is still loading."
        );

        return;
    }


    const {
        jsPDF
    } = window.jspdf;


    const pdf =
        new jsPDF(
            "landscape",
            "mm",
            "a4"
        );


    pdf.setFontSize(18);

    pdf.text(
        "Ma Achiya Villa",
        15,
        15
    );


    pdf.setFontSize(12);

    pdf.text(
        "Daily Meal Report - " +
        selectedDateStr,
        15,
        23
    );


    let y = 34;

    pdf.setFontSize(9);

    pdf.text(
        "Member",
        15,
        y
    );

    pdf.text(
        "Breakfast",
        70,
        y
    );

    pdf.text(
        "Lunch",
        105,
        y
    );

    pdf.text(
        "Dinner",
        135,
        y
    );

    pdf.text(
        "Guest",
        165,
        y
    );

    pdf.text(
        "Main",
        195,
        y
    );

    pdf.text(
        "Total",
        225,
        y
    );


    y += 7;


    members.forEach(member => {

        const m =
            currentMealsData[
                member.id
            ] || {};


        const breakfast =
            m.breakfast ? .5 : 0;

        const lunch =
            m.lunch ? 1 : 0;

        const dinner =
            m.dinner ? 1 : 0;

        const guest =
            Number(m.guest || 0);

        const main =
            breakfast +
            lunch +
            dinner;

        const total =
            main + guest;


        pdf.text(
            String(
                member.name || "Unnamed"
            ).substring(0,28),
            15,
            y
        );

        pdf.text(
            String(breakfast),
            70,
            y
        );

        pdf.text(
            String(lunch),
            105,
            y
        );

        pdf.text(
            String(dinner),
            135,
            y
        );

        pdf.text(
            String(guest),
            165,
            y
        );

        pdf.text(
            String(main),
            195,
            y
        );

        pdf.text(
            String(total),
            225,
            y
        );

        y += 6;

        if (y > 190) {

            pdf.addPage();
            y = 20;

        }

    });


    let mainTotal = 0;
    let guestTotal = 0;


    Object.values(
        currentMealsData
    ).forEach(m => {

        mainTotal +=
            (m.breakfast ? .5 : 0) +
            (m.lunch ? 1 : 0) +
            (m.dinner ? 1 : 0);

        guestTotal +=
            Number(m.guest || 0);

    });


    y += 5;

    pdf.setFontSize(11);

    pdf.text(
        "Main Meals: " +
        formatMeal(mainTotal),
        15,
        y
    );

    pdf.text(
        "Guest Meals: " +
        formatMeal(guestTotal),
        85,
        y
    );

    pdf.text(
        "Grand Total: " +
        formatMeal(
            mainTotal + guestTotal
        ),
        170,
        y
    );


    pdf.save(
        `Ma-Achiya-Villa-${selectedDateStr}.pdf`
    );

};


/* =========================
   PASSWORD
========================= */

window.changePassword =
async function() {

    const oldPass =
        document.getElementById(
            "oldPasswordAssist"
        ).value;

    const newPass =
        document.getElementById(
            "newPasswordAssist"
        ).value;

    const errorEl =
        document.getElementById(
            "assistPasswordError"
        );


    errorEl.textContent = "";


    if (!oldPass || !newPass) {

        errorEl.textContent =
            "Please fill both passwords.";

        return;
    }


    if (newPass.length < 6) {

        errorEl.textContent =
            "New password must be at least 6 characters.";

        return;
    }


    try {

        const {
            EmailAuthProvider,
            reauthenticateWithCredential,
            updatePassword
        } = window.FirebaseFunctions;


        const user =
            window.auth.currentUser;


        if (!user) {

            throw new Error(
                "You are not logged in."
            );

        }


        const credential =
            EmailAuthProvider.credential(
                user.email,
                oldPass
            );


        await reauthenticateWithCredential(
            user,
            credential
        );


        await updatePassword(
            user,
            newPass
        );


        alert(
            "✅ Password updated successfully."
        );


        document.getElementById(
            "oldPasswordAssist"
        ).value = "";

        document.getElementById(
            "newPasswordAssist"
        ).value = "";


    } catch(error) {

        errorEl.textContent =
            error.message;

    }

};


/* =========================
   LOGOUT
========================= */

window.logout =
async function() {

    try {

        await window.FirebaseFunctions
            .signOut(
                window.auth
            );

        localStorage.removeItem(
            "assistLoggedIn"
        );

        window.location.href =
            "login.html";

    } catch(error) {

        console.error(error);

    }

};


/* =========================
   HELPERS
========================= */

function formatMeal(n) {

    return Number(n)
        .toFixed(2)
        .replace(/\.00$/,"")
        .replace(/(\.\d)0$/,"$1");

}


function escapeHTML(str) {

    const div =
        document.createElement("div");

    div.textContent =
        String(str);

    return div.innerHTML;

}


/* =========================
   START
========================= */

window.startAssistantApp =
function() {

    if (
        !window.firebaseReady ||
        !window.auth
    ) {

        return;

    }

    setupAuth();

};
